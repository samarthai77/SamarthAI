<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .chat-box {
            max-width: 700px;
            margin: 2rem auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 1.5rem;
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 1rem;
            background: #fafafa;
            margin-bottom: 1rem;
        }
        .msg {
            margin-bottom: 0.8rem;
            padding: 0.6rem 1rem;
            border-radius: 20px;
            max-width: 80%;
        }
        .user-msg {
            background: #003366;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .ai-msg {
            background: #f0f0f0;
            color: #222;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
        }
        .input-area input {
            flex: 1;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 30px;
            outline: none;
        }
        .input-area button {
            padding: 0.7rem 1.5rem;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SamarthAI</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Chat</a>
            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <div class="chat-box">
        <h2>🤖 AI Chat</h2>
        <div class="messages" id="chatMessages"></div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Type your message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SamarthAI — Har Zaroorat Ka Sathi</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        const API_BASE = 'https://samarthai-backend.onrender.com/api';

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML += `<div class="msg user-msg">${message}</div>`;
            input.value = '';

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                const reply = data.response || 'Sorry, no response.';
                chatBox.innerHTML += `<div class="msg ai-msg">🤖 ${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai-msg">⚠️ Error: ${error.message}</div>`;
            }
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>

</body>
</html>
