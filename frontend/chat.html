<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f5f5; font-family: 'Segoe UI', sans-serif; }

        .chat-container {
            max-width: 750px;
            margin: 1.5rem auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #003366, #0066cc);
            color: white;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .chat-header .avatar {
            width: 48px;
            height: 48px;
            background: #ff6b00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .chat-header .info h3 { font-size: 1.1rem; }
        .chat-header .info p { 
            font-size: 0.8rem; 
            opacity: 0.85;
            margin-top: 2px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #44ff88;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .messages {
            height: 420px;
            overflow-y: auto;
            padding: 1.2rem;
            background: #f9f9f9;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { 
            background: #ccc; 
            border-radius: 10px; 
        }

        .msg-wrapper {
            display: flex;
            margin-bottom: 1rem;
            align-items: flex-end;
            gap: 8px;
        }

        .msg-wrapper.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .msg-avatar.ai { background: #003366; }
        .msg-avatar.user-av { background: #ff6b00; }

        .msg {
            padding: 0.7rem 1.1rem;
            border-radius: 18px;
            max-width: 75%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .user-msg {
            background: linear-gradient(135deg, #003366, #0055aa);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: white;
            color: #222;
            border: 1px solid #e8e8e8;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .msg-time {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 3px;
            text-align: right;
        }

        .typing-indicator {
            display: none;
            padding: 0.7rem 1.1rem;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .input-area {
            display: flex;
            gap: 0.6rem;
            padding: 1rem 1.2rem;
            background: white;
            border-top: 1px solid #eee;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 0.75rem 1.2rem;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            outline: none;
            font-size: 0.95rem;
            transition: border 0.3s;
        }

        .input-area input:focus { border-color: #003366; }

        .input-area button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s, opacity 0.2s;
        }

        .input-area button:hover { transform: scale(1.05); }
        .input-area button:disabled { opacity: 0.6; cursor: not-allowed; }
#micBtn {
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: 50%;
    background: #003366;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 1.25rem;
    flex-shrink: 0;
    transition: transform 0.2s, background 0.2s;
}

#micBtn:hover {
    transform: scale(1.05);
}

#micBtn.listening {
    background: #d32f2f;
    animation: micPulse 1.2s infinite;
}

@keyframes micPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}
        .quick-questions {
            padding: 0.8rem 1.2rem;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 0.4rem 0.9rem;
            background: #f0f4ff;
            border: 1px solid #c0d0ff;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            color: #003366;
            transition: background 0.2s;
        }

        .quick-btn:hover { background: #003366; color: white; }

        .welcome-msg {
            text-align: center;
            padding: 2rem 1rem;
            color: #888;
        }

        .welcome-msg .namaste { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .welcome-msg h3 { color: #003366; margin-bottom: 0.3rem; }
        .welcome-msg p { font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <div class="logo">SamarthAI</div>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="chat.html">Chat</a>
        <a href="services.html">Services</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</header>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">🤖</div>
        <div class="info">
            <h3>SamarthAI Assistant</h3>
            <p><span class="status-dot"></span>Online — Har waqt aapke saath</p>
        </div>
    </div>

    <div class="messages" id="chatMessages">
        <div class="welcome-msg" id="welcomeMsg">
            <div class="namaste">🙏</div>
            <h3>Namaste! Main hoon SamarthAI</h3>
            <p>Aapka apna dost — koi bhi sawaal puchiye, main hamesha yahan hoon!</p>
        </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">
        <span></span><span></span><span></span>
    </div>

    <div class="quick-questions">
        <button class="quick-btn" onclick="quickAsk('Mausam kaisa rahega aaj?')">🌤️ Mausam</button>
        <button class="quick-btn" onclick="quickAsk('Koi achhi kahani sunao')">📖 Kahani</button>
        <button class="quick-btn" onclick="quickAsk('Koi motivational baat batao')">💪 Motivation</button>
        <button class="quick-btn" onclick="quickAsk('Aaj ka news kya hai?')">📰 News</button>
        <button class="quick-btn" onclick="quickAsk('Koi joke sunao')">😄 Joke</button>
    </div>

<div class="input-area">
    <input type="text" id="chatInput" 
           placeholder="Kuch bhi puchiye... main hoon na! 😊" />

    <button id="micBtn" type="button"
            onclick="startVoiceChat()"
            title="Bolkar baat karein">🎙️</button>

    <button id="sendBtn" onclick="sendMessage()">Bhejo ➤</button>
</div>    

</div>

<footer>
    <p>&copy; 2026 SamarthAI — Har Zaroorat Ka Sathi</p>
</footer>

<script src="js/app.js"></script>
<script>
    const CHAT_API = 'https://samarthai-backend.onrender.com/api/chat';
let recognition = null;
let voiceReplyEnabled = false;
let isListening = false;

function setupVoiceRecognition() {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) return false;

    recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
        isListening = true;

        const micBtn = document.getElementById('micBtn');
        if (micBtn) {
            micBtn.classList.add('listening');
            micBtn.textContent = '🔴';
        }

        const input = document.getElementById('chatInput');
        if (input) input.placeholder = 'Sun raha hoon... boliye 🎙️';
    };

    recognition.onresult = (event) => {
        const transcript =
            event.results?.[0]?.[0]?.transcript?.trim();

        if (!transcript) return;

        const input = document.getElementById('chatInput');
        if (!input) return;

        input.value = transcript;
        voiceReplyEnabled = true;

        sendMessage();
    };

    recognition.onerror = (event) => {
        console.warn('[VOICE]', event.error);

        if (event.error === 'not-allowed' ||
            event.error === 'service-not-allowed') {
            addMessage(
                'Microphone permission nahi mili. Browser settings me microphone permission allow karein.',
                false
            );
        } else if (event.error !== 'no-speech' &&
                   event.error !== 'aborted') {
            addMessage(
                'Awaaz samajhne me dikkat hui. Dobara bolkar try karein.',
                false
            );
        }
    };

    recognition.onend = () => {
        isListening = false;

        const micBtn = document.getElementById('micBtn');
        if (micBtn) {
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎙️';
        }

        const input = document.getElementById('chatInput');
        if (input) {
            input.placeholder = 'Kuch bhi puchiye... main hoon na! 😊';
        }
    };

    return true;
}

function startVoiceChat() {
    const token = localStorage.getItem('token');

    if (!token) {
        addMessage('Pehle login kijiye, phir voice chat use karein.', false);
        return;
    }

    if (!recognition && !setupVoiceRecognition()) {
        addMessage(
            'Is browser me voice input available nahi hai. Text se chat kar sakte hain.',
            false
        );
        return;
    }

    if (isListening) {
        recognition.stop();
        return;
    }

    // Purani speech ko queue me jama hone se roko.
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }

    try {
        recognition.start();
    } catch (error) {
        console.warn('[VOICE START]', error);
    }
}

function speakAIResponse(text) {
    if (!voiceReplyEnabled) return;
    if (!('speechSynthesis' in window)) return;
    if (!text || !text.trim()) return;

    window.speechSynthesis.cancel();

    const cleanText = text
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/[*_#`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();

    if (!cleanText) return;

    const utterance = new SpeechSynthesisUtterance(cleanText);

    utterance.lang = 'hi-IN';
    utterance.rate = 0.92;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    const voices = window.speechSynthesis.getVoices();

    const hindiVoice =
        voices.find(v => v.lang === 'hi-IN') ||
        voices.find(v => v.lang?.toLowerCase().startsWith('hi'));

    if (hindiVoice) {
        utterance.voice = hindiVoice;
    }

    utterance.onend = () => {
        voiceReplyEnabled = false;
    };

    utterance.onerror = () => {
        voiceReplyEnabled = false;
    };

    window.speechSynthesis.speak(utterance);
}

if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
    };
}
    function getTime() {
        return new Date().toLocaleTimeString('hi-IN', { 
            hour: '2-digit', minute: '2-digit' 
        });
    }

    function addMessage(text, isUser) {
        const welcomeMsg = document.getElementById('welcomeMsg');
        if (welcomeMsg) welcomeMsg.remove();

        const chatBox = document.getElementById('chatMessages');
        const wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper ' + (isUser ? 'user' : '');

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar ' + (isUser ? 'user-av' : 'ai');
        avatar.textContent = isUser ? '👤' : '🤖';

        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg ' + (isUser ? 'user-msg' : 'ai-msg');
        msgDiv.textContent = text;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'msg-time';
        timeDiv.textContent = getTime();
        msgDiv.appendChild(timeDiv);

        wrapper.appendChild(avatar);
        wrapper.appendChild(msgDiv);
        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping(show) {
        document.getElementById('typingIndicator').style.display = 
            show ? 'block' : 'none';
    }

    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const btn = document.getElementById('sendBtn');
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, true);
        input.value = '';
        btn.disabled = true;
        showTyping(true);

        try {
            const token = localStorage.getItem('token');
            const res = await fetch(CHAT_API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ message })
            });
            const data = await res.json();
            showTyping(false);
            const reply = data.response || 
                'Maafi chahta hoon, abhi samajh nahi paya. Dobara puchiye! 🙏';
            addMessage(reply, false);
           speakAIResponse(reply); 
        } catch (error) {
            showTyping(false);
            addMessage('Arre! Kuch gadbad ho gayi. Thodi der baad try karein. 🙏', false);
        }

        btn.disabled = false;
        input.focus();
    }

    function quickAsk(question) {
        document.getElementById('chatInput').value = question;
        sendMessage();
    }

    document.getElementById('chatInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
