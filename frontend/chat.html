<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — SamarthAI</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f5f8fc;
    color:#17324d
}

body{overflow:hidden}

/* ===== TOP BAR ===== */

.samarth-topbar{
    height:64px;
    width:100%;
    background:rgba(255,255,255,.97);
    display:flex;
    align-items:center;
    padding:8px 14px;
    gap:10px;
    border-bottom:1px solid #e6edf5;
    box-shadow:0 3px 14px rgba(0,51,102,.07);
    position:relative;
    z-index:20
}

.menu-btn{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#003366;
    font-size:25px;
    cursor:pointer;
    border-radius:50%
}

.menu-btn:active{background:#eef4fa}

.brand-box{
    flex:1;
    min-width:0
}

.brand-name{
    font-size:25px;
    line-height:1;
    font-weight:800;
    letter-spacing:-.7px;
    color:#003b78
}

.brand-name span{color:#ff6b00}

.brand-tagline{
    margin-top:3px;
    font-size:11px;
    color:#6b7d90
}

.top-actions{
    display:flex;
    gap:7px
}

.top-actions button{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#f1f6fb;
    color:#003366;
    cursor:pointer;
    font-size:18px
}

.top-actions .profile-mini{
    background:linear-gradient(135deg,#0099ff,#0066cc);
    color:#fff;
    font-weight:700;
    font-size:15px;
    overflow:hidden;
    padding:0
}

.profile-mini img{
    width:100%;
    height:100%;
    object-fit:cover
}

/* ===== CHAT CONTAINER ===== */

.chat-container{
    height:calc(100vh - 64px);
    width:100%;
    max-width:920px;
    margin:0 auto;
    
    background:linear-gradient(180deg,#fff 0%,#f7fbff 100%);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden
}

/* ===== HERO ===== */

.welcome-hero{
    flex:0 0 auto;
    text-align:center;
    padding:18px 16px 8px;
    background:
        radial-gradient(
            circle at 50% 0,
            rgba(0,153,255,.12),
            transparent 45%
        )
}

.hero-avatar{
    width:92px;
    height:92px;
    margin:0 auto 8px;
    border-radius:50%;
    background:linear-gradient(135deg,#003366,#0099ff);
    border:4px solid #fff;
    box-shadow:0 7px 24px rgba(0,102,204,.23);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    cursor:pointer
}

.hero-avatar img{
    width:100%;
    height:100%;
    object-fit:cover
}

.hero-avatar .avatar-fallback{
    font-size:42px
}

.online-badge{
    position:absolute;
    right:1px;
    bottom:2px;
    width:19px;
    height:19px;
    background:#20c765;
    border:3px solid #fff;
    border-radius:50%
}

.welcome-hero h1{
    font-size:18px;
    color:#003366;
    font-weight:700;
    margin:0 0 4px
}

.welcome-hero p{
    font-size:13px;
    color:#66798c;
    margin:0
}

/* ===== MESSAGES ===== */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px 14px 120px;
    scroll-behavior:smooth
}

.messages:empty{
    flex:0 0 0 !important;
    height:0 !important;
    min-height:0 !important;
    padding:0 !important;
    margin:0 !important;
    overflow:hidden !important;
}

.messages::-webkit-scrollbar{
    width:5px
}

.messages::-webkit-scrollbar-thumb{
    background:#c8d3df;
    border-radius:10px
}

.msg-wrapper{
    display:flex;
    margin:0 0 12px;
    align-items:flex-end;
    gap:7px
}

.msg-wrapper.user{
    justify-content:flex-end
}

.msg{
    padding:9px 12px;
    border-radius:16px;
    max-width:min(78%,620px);
    line-height:1.45;
    font-size:14px;
    white-space:pre-wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.05)
}

.user-msg{
    background:linear-gradient(135deg,#003366,#0055aa);
    color:#fff;
    border-bottom-right-radius:4px
}

.ai-msg{
    background:#fff;
    color:#1f2933;
    border:1px solid #e3eaf1;
    border-bottom-left-radius:4px
}

.msg-time{
    font-size:10px;
    color:#9aa8b5;
    margin-top:3px;
    text-align:right
}

/* ===== TYPING ===== */

.typing-indicator{
    display:none;
    position:absolute;
    left:14px;
    bottom:82px;
    padding:8px 11px;
    background:#fff;
    border:1px solid #e3eaf1;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    z-index:5
}

.typing-indicator span{
    display:inline-block;
    width:7px;
    height:7px;
    background:#8c9aaa;
    border-radius:50%;
    margin:0 2px;
    animation:bounce 1.2s infinite
}

.typing-indicator span:nth-child(2){
    animation-delay:.2s
}

.typing-indicator span:nth-child(3){
    animation-delay:.4s
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
        opacity:.55
    }

    50%{
        transform:translateY(-5px);
        opacity:1
    }
}

/* ===== FEATURE AREA ===== */

.assistant-label{
    font-size:14px;
    font-weight:600;
    color:#003366;
    margin:4px 0 12px
}

.feature-area{
    flex:0 0 210px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding-bottom:6px
}

.feature-orbit{
    width:240px;
    height:190px;
    position:relative
}

/* ===== PLUS BUTTON ===== */

.plus-btn{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:66px;
    height:66px;
    border:0;
    border-radius:50%;
    background:linear-gradient(135deg,#ff6b00,#ff8c00);
    color:#fff;
    font-size:40px;
    line-height:1;
    box-shadow:0 10px 24px rgba(255,107,0,.3);
    cursor:pointer;
    z-index:4
}

.plus-btn:active{
    transform:translate(-50%,-50%) scale(.96)
}

/* ===== FEATURE BUTTONS ===== */

.feature-btn{
    position:absolute;
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#003366;
    box-shadow:0 5px 16px rgba(0,51,102,.12);
    border:1px solid #e2eaf2;
    cursor:pointer;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.18s;
   opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:scale(.45); 
}

.feature-btn span{
    position:absolute;
    top:54px;
    white-space:nowrap;
    font-size:10px;
    color:#52677d;
    font-weight:600
}

.feature-btn:active{
    transform:scale(.94)
}
/* ===== RADIAL FEATURES OPEN ===== */

.feature-area.open .feature-btn{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:scale(1);
}

.feature-area.open .plus-btn{
    transform:translate(-50%,-50%) rotate(45deg);
}
.feature-btn[data-pos="chat"]{
    left:95px;
    top:0
}

.feature-btn[data-pos="family"]{
    left:24px;
    top:28px
}

.feature-btn[data-pos="sos"]{
    left:166px;
    top:28px
}

.feature-btn[data-pos="gps"]{
    left:0;
    top:91px
}

.feature-btn[data-pos="scanner"]{
    right:0;
    top:91px
}

.feature-btn[data-pos="services"]{
    left:38px;
    bottom:0
}

.feature-btn[data-pos="profile"]{
    right:38px;
    bottom:0
}

/* ===== PLUS MENU ===== */

.feature-menu{
    display:none;
    position:absolute;
    left:50%;
    bottom:72px;
    transform:translateX(-50%);
    width:min(92%,370px);
    background:rgba(255,255,255,.98);
    border:1px solid #e0e8f0;
    border-radius:18px;
    padding:10px;
    box-shadow:0 14px 35px rgba(0,51,102,.18);
    z-index:10;
    grid-template-columns:repeat(4,1fr);
    gap:8px
}

.feature-menu.open{
    display:grid
}

.menu-feature{
    border:0;
    background:#f5f8fc;
    border-radius:13px;
    padding:9px 4px;
    color:#003366;
    font-size:11px;
    cursor:pointer
}

.menu-feature b{
    display:block;
    font-size:20px;
    margin-bottom:4px
}

.menu-feature:active{
    transform:scale(.97)
}

/* ===== INPUT ===== */

.input-area{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    padding:8px 12px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #e5ebf1;
    display:flex;
    align-items:center;
    gap:7px;
    z-index:100
}
.chat-input-box{
    flex:1;
    min-width:0;
    height:46px;
    border:1px solid #dbe4ed;
    border-radius:25px;
    background:#f7f9fb;
    display:flex;
    align-items:center;
    padding:0 5px
}

.chat-input-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    padding:0 9px;
    font-size:14px;
    color:#203040
}

.attach-btn,
.send-btn,
.mic-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:18px
}

.attach-btn{
    background:transparent;
    color:#60758a
}

.send-btn{
    background:#ff6b00;
    color:#fff
}

.mic-btn{
    background:#003366;
    color:#fff
}

.mic-btn.listening{
    background:#d32f2f;
    animation:micPulse 1.2s infinite
}

@keyframes micPulse{
    0%,100%{
        transform:scale(1)
    }

    50%{
        transform:scale(1.08)
    }
}

footer{
    display:none
}

/* ===== FINAL MOBILE LAYOUT ===== */

<script>

const CHAT_API =
    'https://samarthai-backend.onrender.com/api/chat';

const PROFILE_API =
    'https://samarthai-backend.onrender.com/api/auth/profile';

let recognition = null;
let isListening = false;
let voiceReplyEnabled = false;


/* ===== LOAD PROFILE ===== */

async function loadChatProfile(){

    const token =
        localStorage.getItem('token');

    if(!token) return;

    try{

        const res =
            await fetch(
                PROFILE_API,
                {
                    headers:{
                        Authorization:
                            'Bearer ' + token
                    }
                }
            );

        if(!res.ok) return;

        const data =
            await res.json();

        const p =
            data.user ||
            data.profile ||
            data;

        const photo =
            p.profile_photo_url ||
            p.profilePhotoUrl;

        const avatar =
            document.getElementById(
                'heroAvatar'
            );

        const mini =
            document.querySelector(
                '.profile-mini'
            );

        if(photo){

            const safePhoto =
                photo.replace(
                    /"/g,
                    '&quot;'
                );

            avatar.innerHTML =
                '<img src="' +
                safePhoto +
                '" alt="Profile">' +
                '<span class="online-badge"></span>';

            mini.innerHTML =
                '<img src="' +
                safePhoto +
                '" alt="Profile">';

        }else{

            const name =
                (
                    p.name ||
                    p.full_name ||
                    p.email ||
                    'S'
                ).trim();

            const initial =
                (
                    name.charAt(0) ||
                    'S'
                ).toUpperCase();

            mini.textContent =
                initial;
        }

    }catch(e){

        console.warn(
            '[PROFILE]',
            e
        );

    }

}

function toggleFeatureMenu(){

        document.querySelector('.feature-area');

/* ===== GPT STYLE INPUT FEATURE MENU ===== */

function toggleInputFeatureMenu(){

    const menu =

function openFeature(feature){

    const menu =
        document.getElementById('featureMenu');

    const inputPlus =
        document.getElementById('inputPlusBtn');

    if(menu){
        menu.classList.remove('open');
    }

    if(inputPlus){
        inputPlus.classList.remove('feature-open');
    }
    const routes = {

        family: 'family.html',

        sos: 'sos.html',

        gps: 'gps.html',

        scanner: 'camera.html',

        services: 'services.html',

        profile: 'profile.html'

    };


    if(feature === 'chat'){

        document
            .getElementById('chatInput')
            .focus();

        return;

    }


    if(routes[feature]){

        location.href =
            routes[feature];

    }

}
/* ===== CLOSE MENU OUTSIDE ===== */

document.addEventListener(
    'click',
    function(e){

        const menu =
            document.getElementById(
                'featureMenu'
            );

        const plus =
            document.getElementById(
                'plusBtn'
            );

        const inputPlus =
            document.getElementById(
                'inputPlusBtn'

            menu &&
            menu.classList.contains('open') &&

/* ===== TIME ===== */

function getTime(){

    return new Date()
        .toLocaleTimeString(
            'hi-IN',
            {
                hour:'2-digit',
                minute:'2-digit'
            }
        );

}


/* ===== ADD MESSAGE ===== */

function addMessage(
    text,
    isUser
){

    const box =
        document.getElementById(
            'chatMessages'
        );

    const wrap =
        document.createElement('div');

    wrap.className =
        'msg-wrapper ' +
        (isUser ? 'user' : '');

    const msg =
        document.createElement('div');

    msg.className =
        'msg ' +
        (isUser
            ? 'user-msg'
            : 'ai-msg'
        );

    msg.textContent =
        text;

    const time =
        document.createElement('div');

    time.className =
        'msg-time';

    time.textContent =
        getTime();

    msg.appendChild(time);

    wrap.appendChild(msg);

    box.appendChild(wrap);

    box.scrollTop =
        box.scrollHeight;

}


/* ===== TYPING ===== */

function showTyping(show){

    document
        .getElementById(
            'typingIndicator'
        )
        .style.display =
            show
                ? 'block'
                : 'none';

}


/* ===== SEND MESSAGE ===== */

async function sendMessage(){

    const input =
        document.getElementById(
            'chatInput'
        );

    const btn =
        document.getElementById(
            'sendBtn'
        );

    const message =
        input.value.trim();

    if(!message) return;

    addMessage(
        message,
        true
    );

    input.value =
        '';

    btn.disabled =
        true;

    showTyping(
        true
    );

    try{

        const token =
            localStorage.getItem(
                'token'
            );

        const res =
            await fetch(
                CHAT_API,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json',

                        'Authorization':
                            'Bearer ' + token
                    },

                    body:
                        JSON.stringify({
                            message
                        })
                }
            );

        const data =
            await res.json();

        showTyping(
            false
        );

        const reply =
            data.response ||
            'Maafi chahta hoon, abhi samajh nahi paya. Dobara puchiye! 🙏';

        addMessage(
            reply,
            false
        );

        speakAIResponse(
            reply
        );

    }catch(e){

        showTyping(
            false
        );

        addMessage(
            'Arre! Kuch gadbad ho gayi. Thodi der baad try karein. 🙏',
            false
        );

    }

    btn.disabled =
        false;

    input.focus();

}


/* ===== VOICE RECOGNITION ===== */

function setupVoiceRecognition(){

    const SR =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SR) return false;

    recognition =
        new SR();

    recognition.lang =
        'hi-IN';

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            isListening =
                true;

            const b =
                document.getElementById(
                    'micBtn'
                );

            b.classList.add(
                'listening'
            );

            b.textContent =
                '🔴';

            document.getElementById(
                'chatInput'
            ).placeholder =
                'Sun raha hoon... boliye 🎙️';

        };


    recognition.onresult =
        e => {

            const t =
                e.results?.[0]?.[0]
                    ?.transcript
                    ?.trim();

            if(t){

                document.getElementById(
                    'chatInput'
                ).value =
                    t;

                voiceReplyEnabled =
                    true;

                sendMessage();

            }

        };


    recognition.onerror =
        e => {

            console.warn(
                '[VOICE]',
                e.error
            );

            if(
                e.error ===
                    'not-allowed' ||
                e.error ===
                    'service-not-allowed'
            ){

                addMessage(
                    'Microphone permission nahi mili. Browser settings me microphone permission allow karein.',
                    false
                );

            }

        };


    recognition.onend =
        () => {

            isListening =
                false;

            const b =
                document.getElementById(
                    'micBtn'
                );

            b.classList.remove(
                'listening'
            );

            b.textContent =
                '🎙️';

            document.getElementById(
                'chatInput'
            ).placeholder =
                'Kuch bhi puchiye...';

        };


    return true;

}


/* ===== START VOICE ===== */

function startVoiceChat(){

    if(
        !localStorage.getItem(
            'token'
        )
    ){

        addMessage(
            'Pehle login kijiye, phir voice chat use karein.',
            false
        );

        return;

    }


    if(
        !recognition &&
        !setupVoiceRecognition()
    ){

        addMessage(
            'Is browser me voice input available nahi hai. Text se chat kar sakte hain.',
            false
        );

        return;

    }


    if(isListening){

        recognition.stop();

        return;

    }


    if(
        'speechSynthesis' in
        window
    ){

        window.speechSynthesis.cancel();

    }


    try{

        recognition.start();

    }catch(e){

        console.warn(
            '[VOICE START]',
            e
        );

    }

}


/* ===== AI VOICE REPLY ===== */

function speakAIResponse(text){

    if(
        !voiceReplyEnabled ||
        !('speechSynthesis' in window) ||
        !text?.trim()
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const clean =
        text
            .replace(
                /```[\s\S]*?```/g,
                ' '
            )
            .replace(
                /[*_#`]/g,
                ''
            )
            .replace(
                /\s+/g,
                ' '
            )
            .trim();


    if(!clean) return;


    const u =
        new SpeechSynthesisUtterance(
            clean
        );

    u.lang =
        'hi-IN';

    u.rate =
        .92;

    u.pitch =
        1;

    u.volume =
        1;


    const voices =
        window
            .speechSynthesis
            .getVoices();


    const hv =
        voices.find(
            v =>
                v.lang ===
                'hi-IN'
        ) ||
        voices.find(
            v =>
                v.lang
                    ?.toLowerCase()
                    .startsWith('hi')
        );


    if(hv){

        u.voice =
            hv;

    }


    u.onend =
        () =>
            voiceReplyEnabled =
                false;

    u.onerror =
        () =>
            voiceReplyEnabled =
                false;


    window
        .speechSynthesis
        .speak(u);

}
