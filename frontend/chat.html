<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — SamarthAI</title>
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f5f8fc;
    color:#17324d
}

body{overflow:hidden}

/* ===== TOP BAR ===== */

.samarth-topbar{
    height:64px;
    width:100%;
    background:rgba(255,255,255,.97);
    display:flex;
    align-items:center;
    padding:8px 14px;
    gap:10px;
    border-bottom:1px solid #e6edf5;
    box-shadow:0 3px 14px rgba(0,51,102,.07);
    position:relative;
    z-index:20
}

.menu-btn{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#003366;
    font-size:25px;
    cursor:pointer;
    border-radius:50%
}

.menu-btn:active{background:#eef4fa}

.brand-box{
    flex:1;
    min-width:0
}

.brand-name{
    font-size:25px;
    line-height:1;
    font-weight:800;
    letter-spacing:-.7px;
    color:#003b78
}

.brand-name span{color:#ff6b00}

.brand-tagline{
    margin-top:3px;
    font-size:11px;
    color:#6b7d90
}

.top-actions{
    display:flex;
    gap:7px
}

.top-actions button{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#f1f6fb;
    color:#003366;
    cursor:pointer;
    font-size:18px
}

.top-actions .profile-mini{
    background:linear-gradient(135deg,#0099ff,#0066cc);
    color:#fff;
    font-weight:700;
    font-size:15px;
    overflow:hidden;
    padding:0
}

.profile-mini img{
    width:100%;
    height:100%;
    object-fit:cover
}

/* ===== CHAT CONTAINER ===== */

.chat-container{
    height:calc(100vh - 64px);
    width:100%;
    max-width:920px;
    margin:0 auto;
    
    background:linear-gradient(180deg,#fff 0%,#f7fbff 100%);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden
}

/* ===== HERO ===== */

.welcome-hero{
    flex:0 0 auto;
    text-align:center;
    padding:18px 16px 8px;
    background:
        radial-gradient(
            circle at 50% 0,
            rgba(0,153,255,.12),
            transparent 45%
        )
}

.hero-avatar{
    width:92px;
    height:92px;
    margin:0 auto 8px;
    border-radius:50%;
    background:linear-gradient(135deg,#003366,#0099ff);
    border:4px solid #fff;
    box-shadow:0 7px 24px rgba(0,102,204,.23);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    cursor:pointer
}

.hero-avatar img{
    width:100%;
    height:100%;
    object-fit:cover
}

.hero-avatar .avatar-fallback{
    font-size:42px
}

.online-badge{
    position:absolute;
    right:1px;
    bottom:2px;
    width:19px;
    height:19px;
    background:#20c765;
    border:3px solid #fff;
    border-radius:50%
}

.welcome-hero h1{
    font-size:18px;
    color:#003366;
    font-weight:700;
    margin:0 0 4px
}

.welcome-hero p{
    font-size:13px;
    color:#66798c;
    margin:0
}

/* ===== MESSAGES ===== */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px 14px 120px;
    scroll-behavior:smooth
}

.messages:empty{
    flex:0 0 0 !important;
    height:0 !important;
    min-height:0 !important;
    padding:0 !important;
    margin:0 !important;
    overflow:hidden !important;
}

.messages::-webkit-scrollbar{
    width:5px
}

.messages::-webkit-scrollbar-thumb{
    background:#c8d3df;
    border-radius:10px
}

.msg-wrapper{
    display:flex;
    margin:0 0 12px;
    align-items:flex-end;
    gap:7px
}

.msg-wrapper.user{
    justify-content:flex-end
}

.msg{
    padding:9px 12px;
    border-radius:16px;
    max-width:min(78%,620px);
    line-height:1.45;
    font-size:14px;
    white-space:pre-wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.05)
}

.user-msg{
    background:linear-gradient(135deg,#003366,#0055aa);
    color:#fff;
    border-bottom-right-radius:4px
}

.ai-msg{
    background:#fff;
    color:#1f2933;
    border:1px solid #e3eaf1;
    border-bottom-left-radius:4px
}

.msg-time{
    font-size:10px;
    color:#9aa8b5;
    margin-top:3px;
    text-align:right
}

/* ===== TYPING ===== */

.typing-indicator{
    display:none;
    position:absolute;
    left:14px;
    bottom:82px;
    padding:8px 11px;
    background:#fff;
    border:1px solid #e3eaf1;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    z-index:5
}

.typing-indicator span{
    display:inline-block;
    width:7px;
    height:7px;
    background:#8c9aaa;
    border-radius:50%;
    margin:0 2px;
    animation:bounce 1.2s infinite
}

.typing-indicator span:nth-child(2){
    animation-delay:.2s
}

.typing-indicator span:nth-child(3){
    animation-delay:.4s
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
        opacity:.55
    }

    50%{
        transform:translateY(-5px);
        opacity:1
    }
}

/* ===== FEATURE AREA ===== */

.assistant-label{
    font-size:14px;
    font-weight:600;
    color:#003366;
    margin:4px 0 12px
}

.feature-area{
    flex:0 0 210px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding-bottom:6px
}

.feature-orbit{
    width:240px;
    height:190px;
    position:relative
}

/* ===== PLUS BUTTON ===== */

.plus-btn{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:66px;
    height:66px;
    border:0;
    border-radius:50%;
    background:linear-gradient(135deg,#ff6b00,#ff8c00);
    color:#fff;
    font-size:40px;
    line-height:1;
    box-shadow:0 10px 24px rgba(255,107,0,.3);
    cursor:pointer;
    z-index:4
}

.plus-btn:active{
    transform:translate(-50%,-50%) scale(.96)
}

/* ===== FEATURE BUTTONS ===== */

.feature-btn{
    position:absolute;
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#003366;
    box-shadow:0 5px 16px rgba(0,51,102,.12);
    border:1px solid #e2eaf2;
    cursor:pointer;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.18s;
   opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:scale(.45); 
}

.feature-btn span{
    position:absolute;
    top:54px;
    white-space:nowrap;
    font-size:10px;
    color:#52677d;
    font-weight:600
}

.feature-btn:active{
    transform:scale(.94)
}
/* ===== RADIAL FEATURES OPEN ===== */

.feature-area.open .feature-btn{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:scale(1);
}

.feature-area.open .plus-btn{
    transform:translate(-50%,-50%) rotate(45deg);
}
.feature-btn[data-pos="chat"]{
    left:95px;
    top:0
}

.feature-btn[data-pos="family"]{
    left:24px;
    top:28px
}

.feature-btn[data-pos="sos"]{
    left:166px;
    top:28px
}

.feature-btn[data-pos="gps"]{
    left:0;
    top:91px
}

.feature-btn[data-pos="scanner"]{
    right:0;
    top:91px
}

.feature-btn[data-pos="services"]{
    left:38px;
    bottom:0
}

.feature-btn[data-pos="profile"]{
    right:38px;
    bottom:0
}

/* ===== PLUS MENU ===== */

.feature-menu{
    display:none;
    position:absolute;
    left:50%;
    bottom:72px;
    transform:translateX(-50%);
    width:min(92%,370px);
    background:rgba(255,255,255,.98);
    border:1px solid #e0e8f0;
    border-radius:18px;
    padding:10px;
    box-shadow:0 14px 35px rgba(0,51,102,.18);
    z-index:10;
    grid-template-columns:repeat(4,1fr);
    gap:8px
}

.feature-menu.open{
    display:grid
}

.menu-feature{
    border:0;
    background:#f5f8fc;
    border-radius:13px;
    padding:9px 4px;
    color:#003366;
    font-size:11px;
    cursor:pointer
}

.menu-feature b{
    display:block;
    font-size:20px;
    margin-bottom:4px
}

.menu-feature:active{
    transform:scale(.97)
}

/* ===== INPUT ===== */

.input-area{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    padding:8px 12px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #e5ebf1;
    display:flex;
    align-items:center;
    gap:7px;
    z-index:100
}
.chat-input-box{
    flex:1;
    min-width:0;
    height:46px;
    border:1px solid #dbe4ed;
    border-radius:25px;
    background:#f7f9fb;
    display:flex;
    align-items:center;
    padding:0 5px
}

.chat-input-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    padding:0 9px;
    font-size:14px;
    color:#203040
}

.attach-btn,
.send-btn,
.mic-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:18px
}

.attach-btn{
    background:transparent;
    color:#60758a
}

.send-btn{
    background:#ff6b00;
    color:#fff
}

.mic-btn{
    background:#003366;
    color:#fff
}

.mic-btn.listening{
    background:#d32f2f;
    animation:micPulse 1.2s infinite
}

@keyframes micPulse{
    0%,100%{
        transform:scale(1)
    }

    50%{
        transform:scale(1.08)
    }
}

footer{
    display:none
}


/* ===== FINAL MOBILE CHAT ===== */

@media(max-width:600px){

    html,
    body{
        width:100%;
        height:100%;
        overflow:hidden;
    }

    /* HEADER */
    .samarth-topbar{
        height:58px;
        padding:7px 10px;
    }

    .brand-name{
        font-size:22px;
    }

    .brand-tagline{
        font-size:9px;
    }

    .top-actions{
        gap:5px;
    }

    .top-actions button{
        width:34px;
        height:34px;
    }

    .menu-btn{
        width:36px;
        height:36px;
    }


    /* MAIN CHAT */
    .chat-container{
        width:100%;
        height:calc(100dvh - 58px) !important;
        min-height:0 !important;
        padding:0 !important;
        margin:0 auto;
        overflow:hidden !important;

        display:flex !important;
        flex-direction:column !important;
    }


    /* ASSISTANT */
    .welcome-hero{
        flex:0 0 auto !important;
        padding:8px 12px 6px !important;
        text-align:center;
    }

    .hero-avatar{
        width:64px !important;
        height:64px !important;
        margin:0 auto 4px !important;
    }

    .hero-avatar .avatar-fallback{
        font-size:30px !important;
    }

    .online-badge{
        width:16px;
        height:16px;
        border-width:2px;
    }

    .welcome-hero h1{
        font-size:16px !important;
        margin:0 0 2px !important;
    }

    .welcome-hero p{
        font-size:11px !important;
    }


    /* CHAT MESSAGE AREA */
    .messages{
        position:static !important;

        top:auto !important;
        right:auto !important;
        bottom:auto !important;
        left:auto !important;

        flex:1 1 0 !important;
        min-height:0 !important;
        height:auto !important;

        display:flex !important;
        flex-direction:column !important;
        justify-content:flex-start !important;
        align-items:stretch !important;

        overflow-y:auto !important;
        overflow-x:hidden !important;

        -webkit-overflow-scrolling:touch;

        padding:8px 12px 140px !important;
        margin:0 !important;

        scroll-behavior:smooth;
    }


    .messages:empty{
        flex:1 1 0 !important;
        min-height:0 !important;
        height:auto !important;

        padding:0 12px 140px !important;
        margin:0 !important;

        overflow:hidden !important;
    }


    /* MESSAGE */
    .msg-wrapper{
        display:flex;
        width:100%;
        margin:0 0 10px !important;
        align-items:flex-end;
    }

    .msg{
        max-width:88% !important;
        padding:10px 12px !important;
        font-size:14px !important;
        line-height:1.45 !important;
    }

    .msg-time{
        font-size:9px !important;
    }


    /* DESKTOP RADIAL FEATURES HIDE ON MOBILE */
    .feature-area{
        display:none !important;
    }


    /* GPT STYLE + MENU FROM INPUT */
    .feature-menu{
        display:none;

        position:fixed !important;

        left:10px !important;
        right:10px !important;
        bottom:72px !important;

        width:auto !important;

        transform:none !important;

        padding:10px !important;
max-height:calc(100dvh - 150px);
overflow-y:auto;
grid-template-columns:repeat(4,1fr);      

     gap:6px;  
        border-radius:18px;

        background:rgba(255,255,255,.98);

        border:1px solid #e0e8f0;

        box-shadow:0 12px 35px rgba(0,51,102,.20);

        z-index:10000;
    }

    .feature-menu.open{
        display:grid !important;
    }

    .menu-feature{
    min-height:52px; 

        border:0;

        background:#f5f8fc;

        border-radius:14px;

       padding:6px 3px;
        color:#003366;

        font-size:11px;

        cursor:pointer;
    }

    .menu-feature b{
        display:block;
        font-size:20px;
        margin-bottom:4px;
    }

    .menu-feature:active{
        transform:scale(.96);
    }


    /* CHAT INPUT */
    .input-area{
        position:fixed !important;

        left:0 !important;
        right:0 !important;
        bottom:0 !important;

        width:100% !important;
        height:72px !important;

        padding:8px 8px !important;

        background:rgba(255,255,255,.98);

        border-top:1px solid #e5ebf1;

        z-index:9999;
    }

    .chat-input-box{
        width:100%;
        height:46px !important;
        border-radius:24px;
        padding:0 5px;
    }

    .chat-input-box input{
        font-size:14px;
        padding:0 8px;
    }

    .attach-btn,
    .send-btn,
    .mic-btn{
        width:36px !important;
        height:36px !important;
        min-width:36px !important;
        font-size:16px;
    }

    .attach-btn{
        background:transparent;
    }

    .send-btn{
        background:#ff6b00;
    }

    .mic-btn{
        background:#003366;
    }

    .attach-btn.feature-open{
        transform:rotate(45deg);
        color:#ff6b00;
    }

}
 /* =====================================================
   CONVERSATION DRAWER
===================================================== */

#conversationPanel{
    position:fixed;
    inset:0;
    z-index:50000;
    visibility:hidden;
    pointer-events:none;
}

#conversationPanel.open{
    visibility:visible;
    pointer-events:auto;
}

.conversation-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(2px);
}

.conversation-drawer{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:min(340px,88vw);
    background:#fff;
    box-shadow:12px 0 35px rgba(0,0,0,.18);
    display:flex;
    flex-direction:column;
    padding:14px;
    transform:translateX(-105%);
    transition:transform .22s ease;
}

#conversationPanel.open .conversation-drawer{
    transform:translateX(0);
}

.conversation-header{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#003366;
    font-size:19px;
}

.conversation-header button{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#f1f5f9;
    font-size:24px;
    color:#52677d;
}

.new-chat-button{
    width:100%;
    height:46px;
    border:0;
    border-radius:13px;
    background:#003366;
    color:#fff;
    font-size:14px;
    font-weight:600;
    margin:8px 0 18px;
}

.conversation-title{
    font-size:12px;
    color:#7b8b9b;
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:8px;
}

.conversation-list{
    flex:1;
    overflow-y:auto;
}

.conversation-item{
    width:100%;
    border:0;
    background:transparent;
    border-radius:12px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    cursor:pointer;
    margin-bottom:4px;
}

.conversation-item:hover,
.conversation-item.active{
    background:#eef5fb;
}

.conversation-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#f1f6fa;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.conversation-text{
    min-width:0;
    flex:1;
}

.conversation-text b{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#24384b;
    font-size:13px;
}

.conversation-text small{
    display:block;
    margin-top:2px;
    color:#91a0ad;
    font-size:10px;
}

.empty-history{
    padding:20px 10px;
    text-align:center;
    color:#8a98a6;
    font-size:13px;
}

.conversation-footer{
    border-top:1px solid #e8edf2;
    padding-top:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.conversation-footer button{
    height:40px;
    border:0;
    border-radius:10px;
    background:#f4f7fa;
    color:#003366;
    font-size:12px;
}

@media(max-width:600px){

    .conversation-drawer{
        width:min(330px,88vw);
    }

}  
</style>
</head>

<body>

<header>
    <div class="samarth-topbar">

        <button
            class="menu-btn"
            type="button"
            onclick="history.back()"
            aria-label="Back">
            ☰
        </button>

        <div class="brand-box">
            <div class="brand-name">
                Samarth<span>AI</span>
            </div>

            <div class="brand-tagline">
                Har Zaroorat Ka Sathi
            </div>
        </div>

        <div class="top-actions">

            <button
                type="button"
                title="Search"
                onclick="document.getElementById('chatInput').focus()">
                ⌕
            </button>

            <button
                type="button"
                title="Notifications">
                🔔
            </button>

            <button
                type="button"
                class="profile-mini"
                title="Profile"
                onclick="location.href='profile.html'">
                S
            </button>

        </div>
    </div>
</header>


<div class="chat-container">

    <!-- PROFILE / ASSISTANT -->
    <div class="welcome-hero">

        <div
            class="hero-avatar"
            id="heroAvatar"
            onclick="location.href='profile.html'"
            title="Profile">

            <span class="avatar-fallback">
                👤
            </span>

            <span class="online-badge"></span>

        </div>

        <h1>
            Aapka perasnol assistant
        </h1>

        <p>
            Jo bhi poochna ho, yahin se baat kijiye.
        </p>

    </div>


    <!-- CHAT MESSAGES -->

    <div
        class="messages"
        id="chatMessages">
    </div>


    <!-- TYPING -->

    <div
        class="typing-indicator"
        id="typingIndicator">

        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- FEATURES -->

    <div class="feature-area">

        <div>

            <div class="assistant-label">
                Features
            </div>

            <div class="feature-orbit">

                <button
                    class="feature-btn"
                    data-pos="chat"
                    onclick="openFeature('chat')"
                    title="Chat">
                    💬
                    <span>Chat</span>
                </button>

                <button
                    class="feature-btn"
                    data-pos="family"
                    onclick="openFeature('family')"
                    title="Family Security">
                    👨‍👩‍👧
                    <span>Family</span>
                </button>

                <button
                    class="feature-btn"
                    data-pos="sos"
                    onclick="openFeature('sos')"
                    title="SOS">
                    🆘
                    <span>SOS</span>
                </button>

                <button
                    class="feature-btn"
                    data-pos="gps"
                    onclick="openFeature('gps')"
                    title="GPS">
                    📍
                    <span>GPS</span>
                </button>

                <button
                    class="feature-btn"
                    data-pos="scanner"
                    onclick="openFeature('scanner')"
                    title="Scanner">
                    📷
                    <span>Scanner</span>
                </button>

                <button
                    class="feature-btn"
                    data-pos="services"
                    onclick="openFeature('services')"
                    title="Services">
                    🛠️
                    <span>Services</span>
                </button>

                <button
                    class="feature-btn"
                    data-pos="profile"
                    onclick="openFeature('profile')"
                    title="Profile">
                    👤

let currentConversationId = null;
let conversations = [];


/* ===== LOAD CONVERSATION LIST ===== */

async function loadConversations(){

    const token =
        localStorage.getItem('token');

    if(!token) return [];

    try{

        const res =
            await fetch(
                CHAT_API + '/history',
                {
                    method:'GET',
                    headers:{
                        'Authorization':
                            'Bearer ' + token
                    }
                }
            );

        if(!res.ok){

            console.warn(
                '[CONVERSATIONS]',
                'History load failed'
            );

            return [];

        }

        const data =
            await res.json();

        conversations =
            Array.isArray(data.conversations)
                ? data.conversations
                : [];

        return conversations;

    }catch(error){

        console.error(
            '[CONVERSATIONS]',
            error
        );

        return [];

    }

}


/* ===== CREATE NEW CONVERSATION ===== */

async function createNewConversation(){

    const token =
        localStorage.getItem('token');

    if(!token) return null;

    try{

        const res =
            await fetch(
                CHAT_API + '/conversations',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json',

                        'Authorization':
                            'Bearer ' + token
                    },

                    body:JSON.stringify({
                        title:'New Chat'
                    })
                }
            );

        const data =
            await res.json();

        if(
            !res.ok ||
            !data.success ||
            !data.conversation
        ){

            console.error(
                '[NEW CHAT]',
                data
            );

            return null;

        }

        currentConversationId =
            data.conversation.id;

        conversations.unshift(
            data.conversation
        );

        clearChatScreen();

        renderConversationList();

        closeConversationPanel();

        document
            .getElementById('chatInput')
            ?.focus();

        return data.conversation;

    }catch(error){

        console.error(
            '[NEW CHAT]',
            error
        );

        return null;

    }

}


/* ===== OPEN EXISTING CONVERSATION ===== */

async function openConversation(
    conversationId
){

    if(!conversationId) return;

    const token =
        localStorage.getItem('token');

    if(!token) return;

    try{

        showTyping(true);

        const res =
            await fetch(
                CHAT_API +
                '/history/' +
                encodeURIComponent(
                    conversationId
                ),
                {
                    method:'GET',

                    headers:{
                        'Authorization':
                            'Bearer ' + token
                    }
                }
            );

        const data =
            await res.json();

        if(
            !res.ok ||
            !data.success
        ){

            console.error(
                '[OPEN CONVERSATION]',
                data
            );

            return;

        }

        currentConversationId =
            data.conversation?.id ||
            conversationId;

        clearChatScreen();

        const chats =
            Array.isArray(data.chats)
                ? data.chats
                : [];

        chats.forEach(chat => {

            if(
                chat.message &&
                String(chat.message).trim()
            ){

                addMessage(
                    chat.message,
                    true
                );

            }

            if(
                chat.response &&
                String(chat.response).trim()
            ){

                addMessage(
                    chat.response,
                    false
                );

            }

        });

        renderConversationList();

        closeConversationPanel();

        document
            .getElementById('chatInput')
            ?.focus();

    }catch(error){

        console.error(
            '[OPEN CONVERSATION]',
            error
        );

    }finally{

        showTyping(false);

    }

}

  /* =====================================================
   CLIENT LOCATION
   Weather / location tools ke liye
===================================================== */

async function getClientLocation(){

    const timezone =
        Intl.DateTimeFormat()
            .resolvedOptions()
            .timeZone;

    if(!navigator.geolocation){
        return {
            timezone
        };
    }

    try{

        const position =
            await new Promise(
                (resolve,reject)=>{

                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        reject,
                        {
                            enableHighAccuracy:false,
                            timeout:8000,
                            maximumAge:300000
                        }
                    );

                }
            );

        return {

            latitude:
                Number(position.coords.latitude),

            longitude:
                Number(position.coords.longitude),

            timezone

        };

    }catch(error){

        console.warn(
            '[LOCATION]',
            error.message
        );

        return {
            timezone
        };

    }

}  
/* =====================================================
   SEND MESSAGE — CONVERSATION AWARE
===================================================== */

async function sendMessage(){

    const input =
        document.getElementById(
            'chatInput'
        );

    const btn =
        document.getElementById(
            'sendBtn'
        );

    const message =
        input.value.trim();

    if(!message) return;
const clientLocation =
    await getClientLocation();

    /*
     * Safety:
     * Message bhejne se pehle conversation
     * hona zaroori hai.
     */

    if(!currentConversationId){

        const newConversation =
            await createNewConversation();

        if(
            !newConversation ||
            !newConversation.id
        ){

            addMessage(
                'Chat start nahi ho paayi. Dobara try karein. 🙏',
                false
            );

            return;

        }

    }


    addMessage(
        message,
        true
    );

    input.value = '';

    btn.disabled = true;

    showTyping(true);


    try{

        const token =
            localStorage.getItem('token');

        const res =
            await fetch(
                CHAT_API,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json',

                        'Authorization':
                            'Bearer ' + token
                    },

   body: JSON.stringify({

    message:
        message,

    conversationId:
        currentConversationId,

    mode:
        'conversation',

    metadata: {
        location:
            clientLocation
    }

})
                }
            );


        const data =
            await res.json();


        if(!res.ok){

            console.error(
                '[CHAT API]',
                data
            );

            throw new Error(
                data.error ||
                'Chat request failed'
            );

        }


       const reply =
    data?.result?.response ||
    data?.response ||
    'Maafi chahta hoon, abhi samajh nahi paya. Dobara puchiye! 🙏';
        addMessage(
            reply,
            false
        );


        speakAIResponse(
            reply
        );


        /*
         * Conversation list ko refresh karo,
         * taki updated_at change ke according
         * conversation upar aa jaye.
         */

        await loadConversations();

        renderConversationList();


    }catch(error){

        console.error(
            '[SEND MESSAGE]',
            error
        );

        addMessage(
            'Arre! Kuch gadbad ho gayi. Thodi der baad try karein. 🙏',
            false
        );

    }finally{

        showTyping(false);

        btn.disabled = false;

        input.focus();

    }

}

/* ===== VOICE RECOGNITION ===== */

function setupVoiceRecognition(){

    const SR =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SR) return false;

    recognition =
        new SR();

    recognition.lang =
        'hi-IN';

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            isListening =
                true;

            const b =
                document.getElementById(
                    'micBtn'
                );

            b.classList.add(
                'listening'
            );

            b.textContent =
                '🔴';

            document.getElementById(
                'chatInput'
            ).placeholder =
                'Sun raha hoon... boliye 🎙️';

        };


    recognition.onresult =
        e => {

            const t =
                e.results?.[0]?.[0]
                    ?.transcript
                    ?.trim();

            if(t){

                document.getElementById(
                    'chatInput'
                ).value =
                    t;

                voiceReplyEnabled =
                    true;

                sendMessage();

            }

        };


    recognition.onerror =
        e => {

            console.warn(
                '[VOICE]',
                e.error
            );

            if(
                e.error ===
                    'not-allowed' ||
                e.error ===
                    'service-not-allowed'
            ){

                addMessage(
                    'Microphone permission nahi mili. Browser settings me microphone permission allow karein.',
                    false
                );

            }

        };


    recognition.onend =
        () => {

            isListening =
                false;

            const b =
                document.getElementById(
                    'micBtn'
                );

            b.classList.remove(
                'listening'
            );

            b.textContent =
                '🎙️';

            document.getElementById(
                'chatInput'
            ).placeholder =
                'Kuch bhi puchiye...';

        };


    return true;

}


/* ===== START VOICE ===== */

function startVoiceChat(){

    if(
        !localStorage.getItem(
            'token'
        )
    ){

        addMessage(
            'Pehle login kijiye, phir voice chat use karein.',
            false
        );

        return;

    }


    if(
        !recognition &&
        !setupVoiceRecognition()
    ){

        addMessage(
            'Is browser me voice input available nahi hai. Text se chat kar sakte hain.',
            false
        );

        return;

    }


    if(isListening){

        recognition.stop();

        return;

    }


    if(
        'speechSynthesis' in
        window
    ){

        window.speechSynthesis.cancel();

    }


    try{

        recognition.start();

    }catch(e){

        console.warn(
            '[VOICE START]',
            e
        );

    }

}


/* ===== AI VOICE REPLY ===== */

function speakAIResponse(text){

    if(
        !voiceReplyEnabled ||
        !('speechSynthesis' in window) ||
        !text?.trim()
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const clean =
        text
            .replace(
                /```[\s\S]*?```/g,
                ' '
            )
            .replace(
                /[*_#`]/g,
                ''
            )
            .replace(
                /\s+/g,
                ' '
            )
            .trim();


    if(!clean) return;


    const u =
        new SpeechSynthesisUtterance(
            clean
        );

    u.lang =
        'hi-IN';

    u.rate =
        .92;

    u.pitch =
        1;

    u.volume =
        1;


    const voices =
        window
            .speechSynthesis
            .getVoices();


    const hv =
        voices.find(
            v =>
                v.lang ===
                'hi-IN'
        ) ||
        voices.find(
            v =>
                v.lang
                    ?.toLowerCase()
                    .startsWith('hi')
        );


    if(hv){

        u.voice =
            hv;

    }


    u.onend =
        () =>
            voiceReplyEnabled =
                false;

    u.onerror =
        () =>
            voiceReplyEnabled =
                false;


    window
        .speechSynthesis
        .speak(u);

}

/* ===== RENDER HISTORY ===== */

function renderConversationList(){

    const box =
        document.getElementById(
            'conversationList'
        );

    if(!box) return;


    box.innerHTML = '';


    if(!conversations.length){

        box.innerHTML =
            '<div class="empty-history">Abhi koi chat nahi hai.</div>';

        return;

    }


    conversations.forEach(
        conversation => {

            const item =
                document.createElement(
                    'button'
                );

            item.type =
                'button';

            item.className =
                'conversation-item';


            if(
                conversation.id ===
                currentConversationId
            ){

                item.classList.add(
                    'active'
                );

            }


            const title =
                conversation.title ||
                'New Chat';


            const date =
                conversation.updated_at
                    ? new Date(
                        conversation.updated_at
                      ).toLocaleDateString(
                        'hi-IN',
                        {
                            day:'2-digit',
                            month:'short'
                        }
                      )
                    : '';


            item.innerHTML = `

                <span class="conversation-icon">
                    💬
                </span>

                <span class="conversation-text">

                    <b>
                        ${escapeHtml(title)}
                    </b>

                    <small>
                        ${date}
                    </small>

                </span>

            `;


            item.onclick =
                () =>
                    openConversation(
                        conversation.id
                    );


            box.appendChild(
                item
            );

        }
    );

}


/* ===== HTML ESCAPE ===== */

function escapeHtml(value){

    return String(value || '')
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}


/* ===== REPLACE TOP MENU ACTION ===== */

const menuButton =
    document.querySelector(
        '.menu-btn'
    );

if(menuButton){

    menuButton.onclick =
        function(){

            openConversationPanel();

        };

}


/* ===== CREATE PANEL ON LOAD ===== */

createConversationPanel();   
</script>
