<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .profile-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .profile-card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .profile-card h2 {
            color: #003366;
        }
        .profile-card label {
            font-weight: bold;
            display: block;
            margin-top: 1rem;
        }
        .profile-card input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .profile-card button {
            margin-top: 1.5rem;
            background: #ff6b00;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SamarthAI</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Chat</a>
            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <div class="profile-container">
        <div class="profile-card">
            <h2>👤 My Profile</h2>
            <label>Name</label>
            <input type="text" id="profileName" />
            <label>Email</label>
            <input type="email" id="profileEmail" disabled />
            <label>Phone</label>
            <input type="text" id="profilePhone" />
            <button onclick="updateProfile()">Update Profile</button>
            <p id="profileMessage" style="margin-top:1rem; color:green;"></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SamarthAI — Har Zaroorat Ka Sathi</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        const API_BASE = 'https://samarthai-backend.onrender.com/api';

        async function loadProfileData() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                document.getElementById('profileName').value = data.name || '';
                document.getElementById('profileEmail').value = data.email || '';
                document.getElementById('profilePhone').value = data.phone || '';
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        async function updateProfile() {
            const name = document.getElementById('profileName').value;
            const phone = document.getElementById('profilePhone').value;

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/auth/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, phone })
                });
                const data = await res.json();
                document.getElementById('profileMessage').textContent = data.message || 'Profile updated!';
            } catch (error) {
                console.error('Error updating profile:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfileData);
    </script>

</body>
</html>
