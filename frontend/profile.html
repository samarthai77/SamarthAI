<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />

    <style>
        .profile-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .profile-card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .profile-card h2 {
            color: #003366;
            margin-bottom: 1.5rem;
        }

        /* Profile Photo */
        .profile-photo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .profile-photo-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 1rem;
            position: relative;
        }

        #profilePhotoPreview {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff6b00;
            background: #f1f3f5;
            display: block;
        }

        .photo-placeholder {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #ff6b00;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin: 0 auto;
        }

        .photo-upload-label {
            display: inline-block;
            background: #003366;
            color: white;
            padding: 0.65rem 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .photo-upload-label:hover {
            opacity: 0.9;
        }

        #profilePhotoInput {
            display: none;
        }

        .photo-info {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.6rem;
        }

   .upload-photo-btn {
    display: inline-block;
    background: #ff6b00 !important;
    margin-top: 0.8rem !important;
}    

        .profile-card label {
            font-weight: bold;
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.35rem;
        }

        .profile-card input[type="text"],
        .profile-card input[type="email"] {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .profile-card button {
            margin-top: 1.5rem;
            background: #ff6b00;
            color: white;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .profile-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #profileMessage {
            margin-top: 1rem;
            font-weight: 600;
        }
    </style>
</head>

            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <div class="profile-container">

        <div class="profile-card">

            <h2>👤 My Profile</h2>

            <!-- PROFILE PHOTO -->
            <div class="profile-photo-section">

                <div class="profile-photo-wrapper" id="profilePhotoWrapper">
                    <div class="photo-placeholder" id="photoPlaceholder">
                        👤
                    </div>

                    <img
                        id="profilePhotoPreview"
                        src=""
                        alt="Profile Photo"
                        style="display:none;"
                    />
                </div>

<button
    type="button"
    class="photo-upload-label"
    onclick="document.getElementById('profilePhotoInput').click()"
>
    📷 Choose Profile Photo
</button>

<input
    type="file"
    id="profilePhotoInput"
    accept="image/jpeg,image/png,image/webp"
  accept="image/jpeg,image/png,image/webp"  
/> 
    
       

                                                                                                                                                                                                                                                                                  
                <div class="photo-info">
                    JPG, PNG या WebP • Maximum 5MB
                </div>

                <button
                    type="button"
                    id="uploadPhotoBtn"
                    class="upload-photo-btn"
                    onclick="uploadProfilePhoto()"
                >
                    ⬆️ Upload Photo
                </button>

            </div>

            <!-- NAME -->
            <label>Name</label>

                id="profileName"

            />

            <!-- EMAIL -->

            <p id="profileMessage"></p>
<!-- DELETE ACCOUNT -->
<div
    style="
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #ddd;
    "
>
    <h3 style="color:#b00020;">
        ⚠️ Delete Account
    </h3>

    <p style="color:#666; line-height:1.5;">
        Account delete karne par aapka SamarthAI
        account aur associated personal data permanently
        delete ho jayega.
    </p>

    <button
        type="button"
        onclick="deleteMyAccount()"

            background:#b00020;

    <footer>

    <script src="js/app.js"></script>

    <script>
       
        // =========================
        // LOAD PROFILE
        // =========================

        async function loadProfileData() {
            try {
                const token =
                    localStorage.getItem('token');

                if (!token) {
                    document.getElementById(
                        'profileMessage'
                    ).textContent =
                        'Please login first.';
                    return;
                }

                const res = await fetch(
                    `${API_BASE}/auth/profile`,
                    {
                        headers: {
                            'Authorization':
                                `Bearer ${token}`
                        }
                    }
                );

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(
                        data.error ||
                        'Unable to load profile'
                    );
                }

                document.getElementById(
                    'profileName'
                ).value = data.name || '';

                document.getElementById(
                    'profileEmail'
                ).value = data.email || '';

                document.getElementById(
                    'profilePhone'
                ).value = data.phone || '';

                // Existing profile photo
                if (data.profile_photo_url) {
                    showProfilePhoto(
                        data.profile_photo_url
                    );
                }

            } catch (error) {
                console.error(
                    'Error loading profile:',
                    error
                );
            }
        }


        // =========================
        // SHOW PROFILE PHOTO
        // =========================

        function showProfilePhoto(url) {

            const preview =
                document.getElementById(
                    'profilePhotoPreview'
                );

            const placeholder =
                document.getElementById(
                    'photoPlaceholder'
                );

            preview.src = url;
            preview.style.display = 'block';
            placeholder.style.display = 'none';
        }


 // =========================
// SELECT PHOTO + PREVIEW
// =========================

document.addEventListener('DOMContentLoaded', function () {

    const photoInput =
        document.getElementById('profilePhotoInput');

    if (!photoInput) {
        console.error('profilePhotoInput not found');
        return;
    }

    photoInput.addEventListener('change', function (event) {

        const file = event.target.files &&
                     event.target.files[0];

        console.log('PHOTO SELECTED:', file);

        if (!file) {
            return;
        }

        const allowedTypes = [
            'image/jpeg',
            'image/png',
            'image/webp'
        ];

        if (!allowedTypes.includes(file.type)) {

            alert(
                'Only JPG, PNG and WebP images are allowed.'
            );

            photoInput.value = '';
            return;
        }

        if (file.size > 5 * 1024 * 1024) {

            alert(
                'Photo must be 5MB or smaller.'
            );

            photoInput.value = '';
            return;
        }

        const previewUrl =
            URL.createObjectURL(file);

        showProfilePhoto(previewUrl);

        const message =
            document.getElementById('profileMessage');

        if (message) {

            message.style.color = '#003366';

            message.textContent =
                '✅ Photo selected successfully. Ab Upload Photo dabayein.';
        }

        console.log(
            'PHOTO PREVIEW READY:',
            previewUrl
        );
    });

});
        // =========================
        // UPLOAD PROFILE PHOTO
        // =========================

        async function uploadProfilePhoto() {

            const input =
                document.getElementById(
                    'profilePhotoInput'
                );

            const file = input.files[0];

            if (!file) {
                alert(
                    'Please choose a profile photo first.'
                );
                return;
            }

            const token =
                localStorage.getItem('token');

            if (!token) {
                alert(
                    'Please login first.'
                );
                return;
            }

            const button =
                document.getElementById(
                    'uploadPhotoBtn'
                );

            const message =
                document.getElementById(
                    'profileMessage'
                );

            button.disabled = true;
            button.textContent =
                '⏳ Uploading...';

            message.textContent = '';

            try {

                const formData =
                    new FormData();

                formData.append(
                    'profile_photo',
                    file
                );

                const res = await fetch(
                    `${API_BASE}/auth/profile/photo`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization':
                                `Bearer ${token}`
                        },
                        body: formData
                    }
                );

                const data =
                    await res.json();

                if (!res.ok) {
                    throw new Error(
                        data.error ||
                        'Photo upload failed'
                    );
                }

                if (
                    data.profile_photo_url
                ) {
                    showProfilePhoto(
                        data.profile_photo_url
                    );
                }

                message.style.color =
                    'green';

                message.textContent =
                    '✅ Profile photo uploaded successfully!';

                input.value = '';

                button.style.display =
                    'none';

            } catch (error) {

                console.error(
                    'Profile photo upload error:',
                    error
                );

                message.style.color =
                    'red';

                message.textContent =
                    '❌ ' + error.message;

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    '⬆️ Upload Photo';
            }
        }


        // =========================
        // UPDATE PROFILE
        // =========================

        async function updateProfile() {

            const name =
                document.getElementById(
                    'profileName'
                ).value.trim();

            const phone =
                document.getElementById(
                    'profilePhone'
                ).value.trim();

            const message =
                document.getElementById(
                    'profileMessage'
                );

            if (!name) {
                message.style.color =
                    'red';

                message.textContent =
                    'Name is required.';

                return;
            }

            try {

                const token =
                    localStorage.getItem('token');

                const res = await fetch(
                    `${API_BASE}/auth/profile`,
                    {
                        method: 'PUT',
                        headers: {
                            'Content-Type':
                                'application/json',
                            'Authorization':
                                `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            name,
                            phone
                        })
                    }
                );

                const data =
                    await res.json();

                if (!res.ok) {
                    throw new Error(
                        data.error ||
                        'Profile update failed'
                    );
                }

                message.style.color =
                    'green';

                message.textContent =
                    data.message ||
                    'Profile updated successfully!';

            } catch (error) {

                console.error(
                    'Error updating profile:',
                    error
                );

                message.style.color =
                    'red';

                message.textContent =
                    '❌ ' + error.message;
            }
        }

// =========================
// DELETE ACCOUNT
// =========================

async function deleteMyAccount() {

    const token =
        localStorage.getItem('token');

    if (!token) {
        alert('Please login first.');
        return;
    }

    const firstConfirm = confirm(
        '⚠️ Kya aap apna SamarthAI account permanently delete karna chahte hain?\n\n' +
        'Account aur associated personal data delete ho jayega.\n\n' +
        'Ye action undo nahi kiya ja sakta.'
    );

    if (!firstConfirm) {
        return;
    }

    const secondConfirm = confirm(
        'FINAL CONFIRMATION\n\n' +
        'Kya aap sach mein apna account DELETE karna chahte hain?'
    );

    if (!secondConfirm) {
        return;
    }

    const button =
        document.querySelector(
            'button[onclick="deleteMyAccount()"]'
        );

    if (button) {
        button.disabled = true;
        button.textContent =
            '⏳ Deleting Account...';
    }

    try {

        const res = await fetch(
            `${API_BASE}/auth/account`,
            {
                method: 'DELETE',
                headers: {
                    'Authorization':
                        `Bearer ${token}`
                }
            }
        );

        const data =
            await res.json();

        if (!res.ok) {
            throw new Error(
                data.error ||
                'Account deletion failed'
            );
        }

        // Clear local account session
        localStorage.removeItem('token');
        localStorage.removeItem('user');

        alert(
            '✅ Your SamarthAI account has been permanently deleted.'
        );

        window.location.href =
            'login.html';

    } catch (error) {

        console.error(
            'Delete account error:',
            error
        );

        alert(
            '❌ ' +
            (
                error.message ||
                'Account deletion failed.'
            )
        );

        if (button) {
            button.disabled = false;
            button.textContent =
                '🗑️ Delete My Account';
        }
    }
}
        // =========================
        // LOAD ON START
        // =========================

        document.addEventListener(
            'DOMContentLoaded',
            loadProfileData
        );
    </script>
