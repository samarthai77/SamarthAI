<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <header>
        <div class="logo">SamarthAI</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Chat</a>
            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <section style="max-width:1000px; margin:2rem auto; padding:0 1rem;">
        <h1>Dashboard</h1>
        <p>Welcome to SamarthAI!</p>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:1.5rem; margin-top:2rem;">
            <a href="chat.html" class="feature-card" style="text-decoration:none; color:inherit;">
                <h3>🤖 Chat</h3> 
                <p>AI Chat</p>
            </a>
            <a href="services.html" class="feature-card" style="text-decoration:none; color:inherit;">
                <h3>🛠️ Services</h3>
                <p>Find services</p>
            </a>
            <a href="#" class="feature-card" style="text-decoration:none; color:inherit;">
                <h3>🆘 SOS</h3>
                <p>Emergency</p>
            </a>
            <a href="#" class="feature-card" style="text-decoration:none; color:inherit;">
                <h3>📍 GPS</h3>
                <p>Family tracking</p>
            </a>
        </div>
    </section>
<div class="autonomous-card" style="background: #1e1e2f; padding: 20px; border-radius: 10px; color: #fff; margin-top: 20px;">
    <h3>🤖 SamarthAI Autonomous App Generator</h3>
    <p>Build and deploy your custom app instantly using the self-healing engine.</p>
    
    <div class="form-group" style="margin-bottom: 15px;">
        <label>Project Name:</label>
        <input type="text" id="autoProjectName" placeholder="e.g., MyStoreApp" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label>Project Type:</label>
        <input type="text" id="autoProjectType" placeholder="e.g., E-commerce / Service App" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label>Domain / URL:</label>
        <input type="text" id="autoDomain" placeholder="e.g., mystore.com" style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <button onclick="triggerAutonomousGeneration()" style="background: #4f46e5; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Generate Autonomous App</button>

    <div id="autoResult" style="margin-top: 15px; font-family: monospace; white-space: pre-wrap;"></div>
</div>
    <footer><p>&copy; 2026 SamarthAI</p></footer>
    <script src="js/app.js"></script>
</body>
</html>
