<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .services-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .service-card {
            background: white;
            padding: 1.2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .service-card h3 {
            color: #003366;
        }
        .service-card .price {
            color: #ff6b00;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .service-card .category {
            background: #f0f0f0;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.8rem;
        }
        .add-service-form {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .add-service-form input,
        .add-service-form textarea {
            width: 100%;
            padding: 0.6rem;
            margin-bottom: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .add-service-form button {
            background: #ff6b00;
            color: white;
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SamarthAI</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Chat</a>
            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <div class="services-container">
        <h1>🛠️ Services</h1>

        <!-- Add Service Form -->
        <div class="add-service-form">
            <h3>Add New Service</h3>
            <input type="text" id="serviceTitle" placeholder="Title" />
            <textarea id="serviceDesc" placeholder="Description"></textarea>
            <input type="number" id="servicePrice" placeholder="Price (₹)" />
            <input type="text" id="serviceCategory" placeholder="Category" />
            <input type="text" id="serviceLocation" placeholder="Location" />
            <button onclick="addService()">Add Service</button>
        </div>

        <!-- Service List -->
        <div id="serviceList" class="service-grid"></div>
    </div>

    <footer>
        <p>&copy; 2026 SamarthAI — Har Zaroorat Ka Sathi</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        const API_BASE = 'https://samarthai-backend.onrender.com/api';

        async function loadServices() {
            try {
                const res = await fetch(`${API_BASE}/services`);
                const data = await res.json();
                const container = document.getElementById('serviceList');
                container.innerHTML = '';
                data.forEach(s => {
                    container.innerHTML += `
                        <div class="service-card">
                            <h3>${s.title}</h3>
                            <p>${s.description}</p>
                            <p class="price">₹${s.price}</p>
                            <span class="category">${s.category}</span>
                            <p style="font-size:0.8rem; color:#666;">📍 ${s.location || 'N/A'}</p>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading services:', error);
            }
        }

        async function addService() {
            const title = document.getElementById('serviceTitle').value;
            const description = document.getElementById('serviceDesc').value;
            const price = document.getElementById('servicePrice').value;
            const category = document.getElementById('serviceCategory').value;
            const location = document.getElementById('serviceLocation').value;

            if (!title || !description || !price || !category) {
                alert('Please fill all fields');
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_BASE}/services`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, description, price: Number(price), category, location })
                });
                const data = await res.json();
                alert(data.message || 'Service added!');
                loadServices();
                // Clear form
                ['serviceTitle','serviceDesc','servicePrice','serviceCategory','serviceLocation'].forEach(id => document.getElementById(id).value = '');
            } catch (error) {
                console.error('Error adding service:', error);
            }
        }

        // Load services on page load
        document.addEventListener('DOMContentLoaded', loadServices);
    </script>

</body>
</html>
