<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003366" />
    <title>Services — SamarthAI</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>
        :root {
            --blue: #003366;
            --blue2: #00509e;
            --saffron: #ff6b00;
            --gold: #ffd700;
            --bg: #f5f8fc;
            --card: #ffffff;
            --text: #172033;
            --muted: #687386;
            --border: #e4e9f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            color: white;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 800;
        }

        header nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        header nav a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 8px;
        }

        .services-container {
            width: min(1100px, 100%);
            margin: auto;
            padding: 18px 14px 35px;
        }

        /* Hero */
        .services-hero {
            background: linear-gradient(135deg, #003366, #00509e);
            color: white;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 18px;
            box-shadow: 0 8px 25px rgba(0, 51, 102, 0.16);
        }

        .services-hero h1 {
            margin: 0 0 7px;
            font-size: clamp(1.7rem, 5vw, 2.4rem);
        }

        .services-hero p {
            margin: 0;
            opacity: 0.9;
            line-height: 1.5;
        }

        /* Search */
        .search-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .search-box input {
            width: 100%;
            border: 0;
            outline: none;
            font-size: 1rem;
            padding: 9px 6px;
            background: transparent;
            color: var(--text);
        }

        /* Categories */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 2px 10px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--blue);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 9px;
        }

        .category-btn {
            border: 1px solid var(--border);
            background: white;
            border-radius: 14px;
            padding: 12px 7px;
            cursor: pointer;
            color: var(--text);
            font-size: 0.82rem;
            min-height: 75px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .category-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0,0,0,0.08);
        }

        .category-icon {
            display: block;
            font-size: 1.55rem;
            margin-bottom: 5px;
        }

        .category-btn.active {
            border-color: var(--saffron);
            box-shadow: 0 0 0 2px rgba(255,107,0,0.12);
        }

        /* Services */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 13px;
        }

        .service-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .service-card h3 {
            color: var(--blue);
            margin: 0 0 7px;
        }

        .service-card p {
            margin: 7px 0;
            line-height: 1.45;
        }

        .service-price {
            color: var(--saffron);
            font-weight: 800;
            font-size: 1.15rem;
        }

        .service-meta {
            color: var(--muted);
            font-size: 0.84rem;
        }

        .category-tag {
            display: inline-block;
            background: #eef4fa;
            color: var(--blue);
            border-radius: 20px;
            padding: 5px 9px;
            font-size: 0.75rem;
            margin-top: 5px;
        }
.service-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.service-action-btn {
    flex: 1;
    min-width: 90px;
    border: 0;
    border-radius: 10px;
    padding: 9px 8px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
}

.call-btn {
    background: #e8f7ed;
    color: #18733a;
}

.chat-btn {
    background: #e8f0ff;
    color: #174d9b;
}

.request-btn {
    background: #fff0e6;
    color: #d85b00;
}

.details-btn {
    background: #f0f0f0;
    color: #333;
}
        .empty-state {
            background: white;
            border: 1px dashed #cbd4df;
            border-radius: 16px;
            padding: 28px 15px;
            text-align: center;
            color: var(--muted);
        }

        /* Add service */
        .add-service-form {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            margin-top: 25px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .add-service-form h2 {
            margin-top: 0;
            color: var(--blue);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .add-service-form input,
        .add-service-form textarea,
        .add-service-form select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd4df;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
        }

        .add-service-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        .primary-btn {
            background: var(--saffron);
            color: white;
            border: 0;
            border-radius: 25px;
            padding: 11px 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 10px;
            font-size: 0.88rem;
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
            }

            header nav {
                width: 100%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .category-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SamarthAI</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="chat.html">Chat</a>
        <a href="camera.html">Camera</a>
        <a href="services.html">Services</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
    </nav>
</header>

<main class="services-container">

    <section class="services-hero">
        <h1>🛠️ Har Zaroorat Ki Service</h1>
        <p>
            Apne aas-paas ki useful services khojiye — simple, fast aur low-data.
        </p>
    </section>

    <!-- Search -->
    <div class="search-box">
        <input
            type="search"
            id="serviceSearch"
            placeholder="🔎 Plumber, Electrician, Painter..."
            autocomplete="off"
        />
    </div>

    <!-- Categories -->
    <div class="section-title">
        <h2>Popular Categories</h2>
    </div>

    <div class="category-grid" id="categoryGrid"></div>
<!-- Notification Request -->
<div id="notificationRequestSection" style="display:none; margin-bottom:18px;"></div>
    <!-- Service List -->
    <div class="section-title">
        <h2>Available Services</h2>
    </div>

    <div id="serviceList" class="service-grid">
        <div class="empty-state">Services load ho rahi hain...</div>
    </div>

    <!-- Add Service -->
    <section class="add-service-form">
        <h2>➕ Apni Service Add Karein</h2>

        <div class="form-grid">

            <input
                type="text"
                id="serviceTitle"
                placeholder="Service name"
                maxlength="100"
            />

            <input
                type="number"
                id="servicePrice"
                placeholder="Price (₹)"
                min="0"
                max="10000000"
            />

            <textarea
                class="full"
                id="serviceDesc"
                placeholder="Service ke baare mein..."
                maxlength="500"
            ></textarea>

            <select id="serviceCategory">
                <option value="">Category select karein</option>
            </select>

            <input
                type="text"
                id="serviceLocation"
                placeholder="Location"
                maxlength="100"
            />

            <div class="full">
                <button class="primary-btn" id="addServiceBtn">
                    Add Service
                </button>

                <div id="addStatus" class="status"></div>
            </div>

        </div>
    </section>

</main>

<footer>
    <p style="text-align:center;">
        &copy; 2026 SamarthAI — Har Zaroorat Ka Sathi
    </p>
</footer>

<script src="js/app.js"></script>

<script>
    /*
     * SamarthAI Services
     * Lightweight design:
     * - One API load
     * - No background polling
     * - No continuous GPS
     * - Search/filter happens locally
     * - No heavy images
     */

    const SERVICE_API = 'https://samarthai-backend.onrender.com/api/services';
const urlParams = new URLSearchParams(window.location.search);
const notificationRequestId = urlParams.get('request_id');
 const notificationComplaintId =
    urlParams.get('complaint_id');   
    const categories = [
        { name: 'Plumber', icon: '🔧' },
        { name: 'Electrician', icon: '⚡' },
        { name: 'Construction', icon: '🧱' },
        { name: 'Painter', icon: '🎨' },
        { name: 'Carpenter', icon: '🪚' },
        { name: 'Cleaning', icon: '🧹' },
        { name: 'AC / Fridge', icon: '❄️' },
        { name: 'Vehicle', icon: '🚗' },
        { name: 'Computer', icon: '💻' },
        { name: 'Home Repair', icon: '🏠' },
        { name: 'Transport', icon: '🚚' },
        { name: 'Gardening', icon: '🌳' },
        { name: 'Packers', icon: '📦' },
        { name: 'Technician', icon: '👨‍🔧' },
        { name: 'Other', icon: '➕' }
    ];

    let allServices = [];
    let activeCategory = '';

    const serviceList = document.getElementById('serviceList');
    const searchInput = document.getElementById('serviceSearch');
    const categoryGrid = document.getElementById('categoryGrid');
    const categorySelect = document.getElementById('serviceCategory');
// ============ NEARBY SERVICE SEARCH ============

const nearbyButton = document.createElement('button');

nearbyButton.type = 'button';
nearbyButton.textContent = '📍 Mere Paas Ki Services';
nearbyButton.style.cssText = `
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border: 0;
    border-radius: 12px;
    background: #003366;
    color: white;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
`;

document.querySelector('.search-box').appendChild(nearbyButton);

nearbyButton.addEventListener('click', async () => {
    const query = searchInput.value.trim();
    const category = activeCategory;

    nearbyButton.disabled = true;
    nearbyButton.textContent = '📍 Location detect ho rahi hai...';

    try {
        const position = await new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error('GPS supported nahi hai.'));
                return;
            }

            navigator.geolocation.getCurrentPosition(
                resolve,
                reject,
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        });

        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        nearbyButton.textContent = '🔎 Nearby services search ho rahi hain...';

        const params = new URLSearchParams({
            latitude,
            longitude,
            radius: '20'
        });

        if (category) {
            params.set('category', category);
        }

        const response = await fetch(
            `${SERVICE_API}/nearby?${params.toString()}`,
            {
                method: 'GET',
                cache: 'no-store'
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Nearby search failed');
        }

        allServices = Array.isArray(data) ? data : [];

        renderServices();

        if (!allServices.length) {
            alert(
                category
                    ? `20 km ke andar "${category}" service nahi mili.`
                    : '20 km ke andar koi service nahi mili.'
            );
        }

    } catch (error) {
        console.error('Nearby service error:', error);

        if (error.code === 1) {
            alert('❌ Location permission allow karein.');
        } else if (error.code === 2) {
            alert('❌ Location available nahi hai.');
        } else if (error.code === 3) {
            alert('❌ Location detect karne mein timeout hua.');
        } else {
            alert(
                `❌ Nearby service search failed: ${
                    error.message || 'Please try again.'
                }`
            );
        }

    } finally {
        nearbyButton.disabled = false;
        nearbyButton.textContent = '📍 Mere Paas Ki Services';
    }
});
    function buildCategories() {
        categoryGrid.textContent = '';
        categorySelect.innerHTML = '<option value="">Category select karein</option>';

        categories.forEach(category => {
            const button = document.createElement('button');

            button.type = 'button';
            button.className = 'category-btn';
            button.dataset.category = category.name;

            const icon = document.createElement('span');
            icon.className = 'category-icon';
            icon.textContent = category.icon;

            const label = document.createElement('span');
            label.textContent = category.name;

            button.appendChild(icon);
            button.appendChild(label);

            button.addEventListener('click', () => {
                if (activeCategory === category.name) {
                    activeCategory = '';
                } else {
                    activeCategory = category.name;
                }

                updateCategoryButtons();
                renderServices();
            });

            categoryGrid.appendChild(button);

            const option = document.createElement('option');
            option.value = category.name;
            option.textContent = category.name;
            categorySelect.appendChild(option);
        });
    }

    function updateCategoryButtons() {
        document.querySelectorAll('.category-btn').forEach(button => {
            button.classList.toggle(
                'active',
                button.dataset.category === activeCategory
            );
        });
    }

 function createServiceCard(service) {
    const card = document.createElement('article');
    card.className = 'service-card';

    const title = document.createElement('h3');
    title.textContent = service.title || 'Service';

    const description = document.createElement('p');
    description.textContent =
        service.description || 'No description available.';

    const price = document.createElement('p');
    price.className = 'service-price';
    price.textContent =
        service.price !== null && service.price !== undefined
            ? `₹${service.price}`
            : 'Price available on request';

    const category = document.createElement('span');
    category.className = 'category-tag';
    category.textContent = service.category || 'Other';

    const location = document.createElement('p');
    location.className = 'service-meta';
    location.textContent =
        `📍 ${service.location || 'Location not specified'}`;

    const provider = {
        name: service.provider_name || 'Service Provider',
        photo: service.provider_photo_url || ''
    };

    const providerBox = document.createElement('div');

    providerBox.style.cssText = `
        display:flex;
        align-items:center;
        gap:10px;
        margin-top:12px;
        padding-top:10px;
        border-top:1px solid var(--border);
    `;

    const providerPhoto = document.createElement('img');

    providerPhoto.src =
        provider.photo ||
        'data:image/svg+xml;charset=UTF-8,' +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">
                <rect width="60" height="60" rx="30" fill="#eef4fa"/>
                <text x="30" y="39" text-anchor="middle" font-size="28">👤</text>
            </svg>
        `);

    providerPhoto.alt =
        `${provider.name} profile photo`;

    providerPhoto.style.cssText = `
        width:52px;
        height:52px;
        border-radius:50%;
        object-fit:cover;
        border:2px solid var(--saffron);
        flex-shrink:0;
    `;

    providerPhoto.onerror = () => {
        providerPhoto.src =
            'data:image/svg+xml;charset=UTF-8,' +
            encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">
                    <rect width="60" height="60" rx="30" fill="#eef4fa"/>
                    <text x="30" y="39" text-anchor="middle" font-size="28">👤</text>
                </svg>
            `);
    };

    const providerInfo = document.createElement('div');

    providerInfo.innerHTML = `
        <div style="
            font-size:0.72rem;
            color:var(--muted);
            margin-bottom:2px;
        ">
            Service Provider
        </div>
    `;

    const providerName = document.createElement('strong');

    providerName.textContent = provider.name;

    providerName.style.cssText = `
        color:var(--blue);
        font-size:0.95rem;
    `;

    providerInfo.appendChild(providerName);

    const ratingBox = document.createElement('div');

    ratingBox.textContent =
        '⭐ Rating load ho rahi hai...';

    ratingBox.style.cssText = `
        margin-top:4px;
        font-size:0.82rem;
        color:#d88900;
        font-weight:700;
    `;

    providerInfo.appendChild(ratingBox);

    if (service.provider_id) {

        fetch(
            `https://samarthai-backend.onrender.com/api/reviews/provider/${encodeURIComponent(service.provider_id)}`,
            {
                method: 'GET',
                cache: 'no-store'
            }
        )
        .then(response => response.json())
        .then(data => {

            const rating =
                Number(data.average_rating || 0);

            const count =
                Number(data.rating_count || 0);

            if (count > 0) {

                ratingBox.textContent =
                    `⭐ ${rating.toFixed(1)} (${count} rating${count === 1 ? '' : 's'})`;

            } else {

                ratingBox.textContent =
                    '⭐ No ratings yet';
            }
        })
        .catch(error => {

            console.error(
                'Provider rating error:',
                error
            );

            ratingBox.textContent =
                '⭐ Rating unavailable';
        });
    }

    providerBox.appendChild(providerPhoto);
    providerBox.appendChild(providerInfo);

    card.appendChild(title);
    card.appendChild(description);
    card.appendChild(price);
    card.appendChild(category);
    card.appendChild(location);
    card.appendChild(providerBox);

    const actions = document.createElement('div');

    actions.className =
        'service-actions';

    // ============================================
    // CALL
    // ============================================

    const callBtn =
        document.createElement('button');

    callBtn.className =
        'service-action-btn call-btn';

    callBtn.textContent =
        '📞 Call';

    callBtn.addEventListener(
        'click',
        async () => {

            const token =
                localStorage.getItem('token');

            if (!token) {
                alert('Pehle login karein.');
                return;
            }

            try {

                const response =
                    await fetch(
                        `${SERVICE_API}/${encodeURIComponent(service.id)}/contact`,
                        {
                            headers: {
                                'Authorization':
                                    `Bearer ${token}`
                            }
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.phone
                ) {
                    throw new Error(
                        data.error ||
                        'Phone number available nahi hai.'
                    );
                }

                window.location.href =
                    `tel:${data.phone}`;

            } catch (error) {

                alert(
                    error.message ||
                    'Provider contact nahi mil paya.'
                );
            }
        }
    );

    actions.appendChild(callBtn);

    // ============================================
    // WHATSAPP / CHAT
    // ============================================

    const chatBtn =
        document.createElement('button');

    chatBtn.className =
        'service-action-btn chat-btn';

    chatBtn.textContent =
        '💬 Chat';

    chatBtn.addEventListener(
        'click',
        async () => {

            const token =
                localStorage.getItem('token');

            if (!token) {
                alert('Pehle login karein.');
                return;
            }

            try {

                const response =
                    await fetch(
                        `${SERVICE_API}/${encodeURIComponent(service.id)}/contact`,
                        {
                            headers: {
                                'Authorization':
                                    `Bearer ${token}`
                            }
                        }
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.phone
                ) {
                    throw new Error(
                        data.error ||
                        'Phone number available nahi hai.'
                    );
                }

                const phone =
                    String(data.phone)
                        .replace(/\D/g, '');

                const whatsappNumber =
                    phone.length === 10
                        ? `91${phone}`
                        : phone;

                const message =
                    `Namaste, mujhe "${service.title || 'service'}" ke baare mein jankari chahiye.`;

                window.open(
                    `https://web.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(message)}`,
                    '_blank'
                );

            } catch (error) {

                alert(
                    error.message ||
                    'Provider contact nahi mil paya.'
                );
            }
        }
    );

    actions.appendChild(chatBtn);

    // ============================================
    // WORK / PORTFOLIO PHOTOS
    // ============================================

    const portfolioBtn =
        document.createElement('button');

    portfolioBtn.className =
        'service-action-btn details-btn';

    portfolioBtn.textContent =
        '📷 Work Photos';

    portfolioBtn.addEventListener(
        'click',
        () => {
            openPortfolio(service);
        }
    );

    actions.appendChild(portfolioBtn);

    // ============================================
    // PROVIDER DETAILS
    // ============================================

    const detailsBtn =
        document.createElement('button');

    detailsBtn.className =
        'service-action-btn details-btn';

    detailsBtn.textContent =
        '👤 Details';

    detailsBtn.addEventListener(
        'click',
        () => {

            alert(
                `Provider Details\n\n` +
                `Name: ${provider.name}\n` +
                `Phone: Call ya Chat button se available hoga.\n` +
                `Service: ${service.title || 'Not available'}\n` +
                `Location: ${service.location || 'Not specified'}`
            );
        }
    );

    actions.appendChild(detailsBtn);

    // ============================================
    // CUSTOMER REVIEWS
    // ============================================

    const reviewsBtn =
        document.createElement('button');

    reviewsBtn.className =
        'service-action-btn details-btn';

    reviewsBtn.textContent =
        '💬 Reviews';

    reviewsBtn.addEventListener(
        'click',
        () => {
            openProviderReviews(service);
        }
    );

    actions.appendChild(reviewsBtn);

    // ============================================
    // CUSTOMER COMPLAINT / REPORT
    // ============================================

    const reportBtn =
        document.createElement('button');

    reportBtn.className =
        'service-action-btn details-btn';

    reportBtn.textContent =
        '🚩 Report';

    reportBtn.addEventListener(
        'click',
        () => {
            openProviderComplaint(service);
        }
    );

    actions.appendChild(reportBtn);

    // ============================================
    // REQUEST SERVICE

async function requestService(service) {
    const token = localStorage.getItem('token');

    if (!token) {
        alert('Pehle login karein.');
        return;
    }

    const location = prompt(
        'Service kis location par chahiye?'
    );

    if (location === null) {
        return;
    }

    const description =
        `Service request: ${service.title || 'Service'}\n` +
       `Provider: ${service.provider_name || 'Service Provider'}\n` +
        `Details: ${service.description || ''}`;

    try {
        const response = await fetch(
            'https://samarthai-backend.onrender.com/api/requests',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
               provider_id: service.provider_id || null,     
                    category: service.category || 'Other',
                    description,
                    budget: service.price ?? null,
                    location: location.trim() || service.location || null
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Request failed');
        }

        alert(
            '✅ Service Request bhej di gayi.\n\n' +
            'Provider se contact karne ke liye Call ya Chat use kar sakte hain.'
        );

    } catch (error) {
        console.error('Service request error:', error);
        alert('❌ Service request nahi ja paayi. Please try again.');
    }
}

function getLoggedInUserId() {
    try {
        const token = localStorage.getItem('token');

        if (!token) return null;

        const payload = JSON.parse(
            atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))
        );

        return payload.id || null;
    } catch (error) {
        return null;
    }

/* ============================================
   PROVIDER ACCEPT / REJECT REQUEST
============================================ */

async function updateProviderRequestStatus(
    requestId,
    status
) {

    const token =
        localStorage.getItem('token');

    if (!token) {
        alert('Pehle login karein.');
        return;
    }

    const actionText =
        status === 'accepted'
            ? 'Accept'
            : 'Reject';

    const confirmed =
        confirm(
            `Kya aap is request ko ${actionText} karna chahte hain?`
        );

    if (!confirmed) return;

    const section =
        document.getElementById(
            'notificationRequestSection'
        );

    try {

        const response = await fetch(
            `https://samarthai-backend.onrender.com/api/requests/provider/${encodeURIComponent(requestId)}/status`,
            {
                method: 'PUT',

                headers: {
                    'Content-Type':
                        'application/json',

                    'Authorization':
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    status
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                'Request status update failed'
            );
        }

        alert(
            status === 'accepted'
                ? '✅ Request accepted successfully.'
                : '❌ Request rejected successfully.'
        );

        await loadNotificationRequest();

    } catch (error) {

        console.error(
            'Provider request status error:',
            error
        );

        alert(
            `❌ ${error.message || 'Request update failed'}`
        );
    }
}

async function loadNotificationComplaint() {

                    'Authorization': `Bearer ${token}`
                },
