<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOS — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .sos-container {
            max-width: 600px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .sos-btn {
            background: red;
            color: white;
            padding: 1.5rem 4rem;
            font-size: 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin: 1rem 0;
        }
        .sos-btn:hover {
            background: darkred;
        }
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">SamarthAI</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Chat</a>
            <a href="services.html">Services</a>
            <a href="sos.html">SOS</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <div class="sos-container">
        <h1>🆘 SOS Emergency</h1>
        <p>Click the button below to send an emergency alert</p>
        <button class="sos-btn" onclick="sendSOS()">🚨 SOS</button>
        <div class="status" id="sosStatus">Ready</div>
    </div>

    <footer><p>&copy; 2026 SamarthAI</p></footer>
    <script src="js/app.js"></script>
    <script>
    

       async function sendSOS() {

    const status =
        document.getElementById("sosStatus");

    try {

        const confirmed = window.confirm(
            "Are you sure you want to send an SOS emergency alert?"
        );

        if (!confirmed) {
            status.textContent = "SOS cancelled.";
            status.style.background = "#fff3cd";
            return;
        }

        const token =
            localStorage.getItem("token");

        if (!token) {
            status.textContent =
                "❌ Please login again.";
            status.style.background =
                "#f8d7da";
            return;
        }

        status.textContent =
            "📍 Getting your current GPS location...";
        status.style.background =
            "#fff3cd";

        if (!navigator.geolocation) {
            throw new Error(
                "GPS is not supported by this device."
            );
        }

        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;

                status.textContent =
                    "🚨 Sending SOS...";

                status.style.background =
                    "#fff3cd";

                const res =
                    await fetch(
                        `${API_BASE}/sos`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            },

                            body: JSON.stringify({
                                latitude: latitude,
                                longitude: longitude
                            })
                        }
                    );

                let data = {};

                try {
                    data =
                        await res.json();
                } catch (e) {
                    data = {};
                }

                if (res.status === 201) {

                    status.textContent =
                        "✅ SOS Sent Successfully!";

                    status.style.background =
                        "#d4edda";

                } else {

                    status.textContent =
                        "❌ Failed: " +
                        (
                            data.error ||
                            "Unknown error"
                        );

                    status.style.background =
                        "#f8d7da";
                }
            },

            function(error) {

                let message =
                    "Unable to get GPS location.";

                if (
                    error.code ===
                    error.PERMISSION_DENIED
                ) {
                    message =
                        "Location permission denied. Please allow location access.";
                }

                else if (
                    error.code ===
                    error.POSITION_UNAVAILABLE
                ) {
                    message =
                        "Current location is unavailable.";
                }

                else if (
                    error.code ===
                    error.TIMEOUT
                ) {
                    message =
                        "GPS request timed out. Please try again.";
                }

                status.textContent =
                    "❌ " + message;

                status.style.background =
                    "#f8d7da";
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );

    } catch (error) {

        console.error(
            "SOS Error:",
            error
        );

        status.textContent =
            "❌ " +
            (
                error.message ||
                "SOS failed"
            );

        status.style.background =
            "#f8d7da";
    }
}
          
    </script>
</body>
</html>
