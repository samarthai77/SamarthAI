<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Forgot Password — SamarthAI</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    />

    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .auth-container input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .auth-container button {
            width: 100%;
            padding: 0.7rem;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-container a {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #003366;
        }

        #message {
            margin-top: 1rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <h2>Forgot Password</h2>

        <p>
            Enter your registered email address.
            If an account exists, we will send a
            password reset link.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
            required
        />

        <button
            id="submitBtn"
            onclick="requestPasswordReset()"
        >
            Send Reset Link
        </button>

        <p id="message"></p>

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

    <script>
        const API_BASE =
            'https://samarthai-backend.onrender.com/api';

        async function requestPasswordReset() {

            const emailInput =
                document.getElementById('email');

            const message =
                document.getElementById('message');

            const button =
                document.getElementById('submitBtn');

            const email =
                emailInput.value.trim();

            if (!email) {
                message.style.color = 'red';
                message.textContent =
                    'Please enter your email address.';
                return;
            }

            button.disabled = true;
            button.textContent = 'Sending...';

            message.style.color = '#003366';
            message.textContent =
                'Please wait...';

            try {

                const res = await fetch(
                    `${API_BASE}/auth/forgot-password`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            email
                        })
                    }
                );

                const data =
                    await res.json();

                if (!res.ok) {
                    message.style.color = 'red';

                    message.textContent =
                        data.error ||
                        'Unable to process request.';

                    return;
                }

                message.style.color = 'green';

                message.textContent =
                    data.message ||
                    'If an account exists for this email, a password reset link has been sent.';

            } catch (error) {

                console.error(
                    'Forgot password error:',
                    error
                );

                message.style.color = 'red';

                message.textContent =
                    'Unable to connect to the server. Please try again later.';

            } finally {

                button.disabled = false;
                button.textContent =
                    'Send Reset Link';
            }
        }
    </script>

</body>
</html>
