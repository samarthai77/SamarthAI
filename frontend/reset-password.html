<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Reset Password — SamarthAI</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    />

    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .auth-container input {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .auth-container button {
            width: 100%;
            padding: 0.7rem;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-container a {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #003366;
        }

        #message {
            margin-top: 1rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <h2>Reset Password</h2>

        <p>
            Enter your new password below.
        </p>

        <input
            type="password"
            id="password"
            placeholder="New password"
            autocomplete="new-password"
            minlength="8"
        />

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
            minlength="8"
        />

        <button
            id="resetBtn"
            onclick="resetPassword()"
        >
            Reset Password
        </button>

        <p id="message"></p>

        <a href="login.html">
            ← Back to Login
        </a>

    </div>

    <script>
        const API_BASE =
            'https://samarthai-backend.onrender.com/api';

        // Get the one-time token from the email link.
        const params =
            new URLSearchParams(
                window.location.search
            );

        const resetToken =
            params.get('token');

        const message =
            document.getElementById('message');

        // ------------------------------------------------
        // TOKEN CHECK
        // ------------------------------------------------

        if (
            !resetToken ||
            !/^[a-f0-9]{64}$/i.test(resetToken)
        ) {

            message.style.color = 'red';

            message.textContent =
                'This password reset link is invalid or incomplete.';

            document.getElementById(
                'resetBtn'
            ).disabled = true;
        }

        // ------------------------------------------------
        // RESET PASSWORD
        // ------------------------------------------------

        async function resetPassword() {

            const password =
                document.getElementById(
                    'password'
                ).value;

            const confirmPassword =
                document.getElementById(
                    'confirmPassword'
                ).value;

            const button =
                document.getElementById(
                    'resetBtn'
                );

            if (!resetToken) {
                message.style.color = 'red';

                message.textContent =
                    'Invalid or expired reset link.';

                return;
            }

            if (password.length < 8) {

                message.style.color = 'red';

                message.textContent =
                    'Password must be at least 8 characters.';

                return;
            }

            if (password !== confirmPassword) {

                message.style.color = 'red';

                message.textContent =
                    'Passwords do not match.';

                return;
            }

            button.disabled = true;
            button.textContent = 'Resetting...';

            message.style.color = '#003366';

            message.textContent =
                'Please wait...';

            try {

                const res = await fetch(
                    `${API_BASE}/auth/reset-password`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            token: resetToken,
                            password
                        })
                    }
                );

                const data =
                    await res.json();

                if (!res.ok) {

                    message.style.color = 'red';

                    message.textContent =
                        data.error ||
                        'Password reset failed.';

                    return;
                }

                message.style.color = 'green';

                message.textContent =
                    data.message ||
                    'Password reset successfully.';

                document.getElementById(
                    'password'
                ).value = '';

                document.getElementById(
                    'confirmPassword'
                ).value = '';

                // Prevent the one-time token from
                // remaining visible in browser history.
                window.history.replaceState(
                    {},
                    document.title,
                    'reset-password.html'
                );

            } catch (error) {

                console.error(
                    'Reset password error:',
                    error
                );

                message.style.color = 'red';

                message.textContent =
                    'Unable to connect to the server. Please try again later.';

            } finally {

                button.disabled = false;
                button.textContent =
                    'Reset Password';
            }
        }
    </script>

</body>
</html>
