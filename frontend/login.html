<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — SamarthAI Kavach</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            font-family:Arial,Helvetica,sans-serif;
            background:
                radial-gradient(circle at top left,rgba(255,107,0,.18),transparent 35%),
                radial-gradient(circle at bottom right,rgba(0,51,102,.18),transparent 35%),
                linear-gradient(135deg,#f7fbff,#eef4fa);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            color:#17324d;
        }

        .auth-wrapper{
            width:100%;
            max-width:430px;
        }

        .auth-card{
            background:rgba(255,255,255,.96);
            border:1px solid rgba(255,255,255,.8);
            border-radius:24px;
            padding:32px 28px 26px;
            box-shadow:0 20px 55px rgba(0,51,102,.14);
        }

        .brand{
            text-align:center;
            margin-bottom:25px;
        }

        .logo{
            width:70px;
            height:70px;
            margin:0 auto 12px;
            border-radius:20px;
            background:linear-gradient(135deg,#ff6b00,#003366);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:30px;
            font-weight:800;
            box-shadow:0 10px 25px rgba(0,51,102,.2);
        }

        .brand h1{
            font-size:28px;
            color:#003366;
            margin-bottom:4px;
        }

        .brand h1 span{
            color:#ff6b00;
        }

        .brand p{
            font-size:13px;
            color:#718096;
        }

        .title{
            text-align:center;
            margin-bottom:22px;
        }

        .title h2{
            font-size:22px;
            color:#17324d;
            margin-bottom:5px;
        }

        .title p{
            font-size:13px;
            color:#718096;
        }

        .language-row{
            margin-bottom:16px;
        }

        .language-row label{
            display:block;
            font-size:12px;
            font-weight:700;
            color:#536579;
            margin-bottom:7px;
        }

        select,
        input{
            width:100%;
            height:50px;
            border:1px solid #d7e1eb;
            border-radius:13px;
            background:#fff;
            padding:0 14px;
            font-size:14px;
            color:#17324d;
            outline:none;
            transition:.2s;
        }

        select:focus,
        input:focus{
            border-color:#0077cc;
            box-shadow:0 0 0 3px rgba(0,119,204,.10);
        }

        .field{
            margin-bottom:14px;
        }

        .field label{
            display:block;
            font-size:12px;
            font-weight:700;
            color:#536579;
            margin-bottom:7px;
        }

        .password-box{
            position:relative;
        }

        .password-box input{
            padding-right:52px;
        }

        .show-password{
            position:absolute;
            right:7px;
            top:7px;
            width:36px;
            height:36px;
            border:0;
            border-radius:10px;
            background:#f1f6fa;
            cursor:pointer;
            color:#003366;
            font-size:17px;
        }

        .forgot{
            display:block;
            text-align:right;
            margin:-3px 2px 18px;
            color:#0066aa;
            text-decoration:none;
            font-size:13px;
            font-weight:600;
        }

        .login-btn{
            width:100%;
            height:52px;
            border:0;
            border-radius:14px;
            background:linear-gradient(135deg,#ff6b00,#ff8a00);
            color:white;
            font-size:15px;
            font-weight:800;
            cursor:pointer;
            box-shadow:0 9px 20px rgba(255,107,0,.22);
        }

        .login-btn:disabled{
            opacity:.65;
            cursor:not-allowed;
        }

        .message{
            min-height:20px;
            margin-top:12px;
            text-align:center;
            font-size:13px;
            color:#d93025;
        }

        .create{
            text-align:center;
            margin-top:18px;
            font-size:13px;
            color:#718096;
        }

        .create a{
            color:#0066aa;
            font-weight:700;
            text-decoration:none;
        }

        .legal{
            text-align:center;
            margin-top:18px;
            font-size:11px;
            color:#8a98a8;
            line-height:1.5;
        }

        .legal a{
            color:#66798c;
            text-decoration:none;
        }

        .secure{
            text-align:center;
            margin-top:12px;
            font-size:11px;
            color:#6b7d90;
        }

        @media(max-width:480px){
            body{
                padding:12px;
            }

            .auth-card{
                padding:27px 20px 22px;
                border-radius:20px;
            }

            .brand h1{
                font-size:25px;
            }
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="brand">
            <div class="logo">SA</div>

            <h1>Samarth<span>AI</span></h1>

            <p>Har Zaroorat Ka Sathi</p>
        </div>

        <div class="title">
            <h2>Welcome Back</h2>
            <p>Apne SamarthAI account me login karein</p>
        </div>

        <!-- LANGUAGE -->
        <div class="language-row">

            <label for="language">
                Language / भाषा
            </label>

     <select id="language" onchange="saveLanguage()"></select>    

        </div>

        <!-- EMAIL -->
        <div class="field">

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>

        <!-- PASSWORD -->
        <div class="field">

            <label for="loginPassword">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>

        </div>

        <a
            class="forgot"
            href="forgot-password.html"
        >
            Forgot password?
        </a>

        <button
            class="login-btn"
            id="loginBtn"
            onclick="login()"
        >
            Login
        </button>

        <p
            id="loginMessage"
            class="message"
        ></p>

        <div class="create">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

        <div class="legal">

            By continuing, you agree to our

            <a href="privacy-policy.html">
                Privacy Policy
            </a>

            and applicable terms.

        </div>

        <div class="secure">
            🔒 Secure account authentication
        </div>

    </div>

</div>
<script src="languages.js"></script>

<script>


const API_BASE =
    'https://samarthai-backend.onrender.com/api';

function populateLanguageSelector(){

    const selector =
        document.getElementById('language');

    if(!selector){
        return;
    }

    const languages =
        typeof getSamarthAILanguages === 'function'
            ? getSamarthAILanguages()
            : [];

    selector.innerHTML = '';

    languages.forEach(
        language => {

            const option =
                document.createElement('option');

            option.value =
                language.code;

            option.textContent =
                language.nativeName +
                ' — ' +
                language.name;

            selector.appendChild(option);

        }
    );


    const savedLanguage =
        localStorage.getItem(
            'samarthai_language'
        ) || 'hi-IN';


    if(
        languages.some(
            language =>
                language.code === savedLanguage
        )
    ){

        selector.value =
            savedLanguage;

    }

}


populateLanguageSelector();
/* ===== LANGUAGE ===== */

function saveLanguage(){

    const language =
        document.getElementById(
            'language'
        ).value;

    localStorage.setItem(
        'samarthai_language',
        language
    );

}


/* ===== LOAD LANGUAGE ===== */

const savedLanguage =
    localStorage.getItem(
        'samarthai_language'
    );

if(savedLanguage){

    document.getElementById(
        'language'
    ).value =
        savedLanguage;

}


/* ===== PASSWORD ===== */

function togglePassword(){

    const input =
        document.getElementById(
            'loginPassword'
        );

    const button =
        document.querySelector(
            '.show-password'
        );

    if(input.type === 'password'){

        input.type = 'text';

        button.textContent = '🙈';

    }else{

        input.type = 'password';

        button.textContent = '👁';

    }

}


/* ===== LOGIN ===== */

async function login(){

    const email =
        document.getElementById(
            'loginEmail'
        ).value.trim();

    const password =
        document.getElementById(
            'loginPassword'
        ).value;

    const message =
        document.getElementById(
            'loginMessage'
        );

    const button =
        document.getElementById(
            'loginBtn'
        );


    message.textContent = '';


    if(!email || !password){

        message.textContent =
            'Please enter email and password.';

        return;

    }


    saveLanguage();


    button.disabled = true;

    button.textContent =
        'Logging in...';


    try{

        const res =
            await fetch(
                `${API_BASE}/auth/login`,
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        email,
                        password
                    })
                }
            );


        const data =
            await res.json();


        if(data.token){

            localStorage.setItem(
                'token',
                data.token
            );

            localStorage.setItem(
                'user',
                JSON.stringify(
                    data.user
                )
            );


            /*
             * IMPORTANT:
             * SamarthAI ka Home = Chat
             * Dashboard user ko nahi dikhana.
             */

            window.location.href =
                'chat.html';

            return;

        }


        message.textContent =
            data.error ||
            'Login failed.';


    }catch(error){

        console.error(
            '[LOGIN]',
            error
        );

        message.textContent =
            'Network error. Please try again.';

    }finally{

        button.disabled = false;

        button.textContent =
            'Login';

    }

}

</script>

</body>
</html>
