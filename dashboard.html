<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — SamarthAI</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">SamarthAI</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Chat</a>
            <a href="services.html">Services</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <!-- DASHBOARD -->
    <section class="dashboard" style="max-width:1000px; margin:2rem auto; padding:0 1rem;">
        <h1>Dashboard</h1>
        <p>Welcome back, <span id="userName">User</span>!</p>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:1.5rem; margin-top:2rem;">
            <div class="feature-card">
                <h3>🤖 AI Chat</h3>
                <p>Chat with AI assistant</p>
                <a href="chat.html" class="btn" style="display:inline-block; margin-top:0.5rem;">Go</a>
            </div>
            <div class="feature-card">
                <h3>🛠️ Services</h3>
                <p>Find or list services</p>
                <a href="services.html" class="btn" style="display:inline-block; margin-top:0.5rem;">Go</a>
            </div>
            <div class="feature-card">
                <h3>🆘 SOS</h3>
                <p>Emergency alert</p>
                <a href="#" class="btn" style="display:inline-block; margin-top:0.5rem;">Send</a>
            </div>
            <div class="feature-card">
                <h3>📍 GPS</h3>
                <p>Family tracking</p>
                <a href="#" class="btn" style="display:inline-block; margin-top:0.5rem;">Go</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 SamarthAI — Har Zaroorat Ka Sathi</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
